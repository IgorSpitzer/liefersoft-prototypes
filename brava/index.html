<!DOCTYPE html>
<html lang="ru">

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#d9d2c6;
  --bg:#faf6f0; --ink:#3c261e; --mute:#96806f; --soft:#f1e9de; --line:#e4d8c8;

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#1c1714; } }
:root[data-theme="dark"]{ --page:#1c1714; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--page);display:flex;align-items:center;justify-content:center;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
.kiosk{height:min(calc(100% - 32px),calc((100vw - 32px) * 16 / 9));aspect-ratio:9/16;container-type:size;border-radius:clamp(0px,2.2vh,28px);overflow:hidden;box-shadow:0 30px 80px rgba(40,25,15,.35);position:relative;background:var(--bg)}

.app{--u:calc(100cqw / 1080);position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 33%,#f6e4cf 0,rgba(250,246,240,0) 42%),var(--bg);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:calc(4*var(--u)) solid var(--or1);outline-offset:calc(4*var(--u))}
.abs{position:absolute}
.serif{font-family:"Playfair Display",Georgia,serif}

/* ---------- top bar ---------- */
.round{position:absolute;top:calc(68*var(--u));width:calc(64*var(--u));height:calc(64*var(--u));border-radius:50%;background:var(--soft);display:grid;place-items:center;transition:opacity .35s,transform .35s;z-index:3}

.mode{position:absolute;left:calc(68*var(--u));top:calc(68*var(--u));height:calc(64*var(--u));border-radius:calc(32*var(--u));background:var(--soft);display:flex;align-items:center;gap:calc(10*var(--u));padding:0 calc(26*var(--u)) 0 calc(20*var(--u));font-size:calc(19*var(--u));font-weight:700;transition:opacity .35s,transform .35s;z-index:3}
.mode svg{width:calc(28*var(--u));height:calc(28*var(--u))}

.cart{right:calc(68*var(--u))}
.lang{right:calc(150*var(--u));font-size:calc(17*var(--u));font-weight:800;letter-spacing:.04em}
.badge{position:absolute;top:calc(-8*var(--u));right:calc(-8*var(--u));min-width:calc(28*var(--u));height:calc(28*var(--u));padding:0 calc(7*var(--u));border-radius:calc(14*var(--u));background:var(--or1);color:#fff;font-size:calc(15*var(--u));font-weight:800;display:grid;place-items:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.badge.on{transform:scale(1)}
.badge.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{40%{transform:scale(1.5)}100%{transform:scale(1)}}
.logo{left:0;right:0;top:calc(70*var(--u));text-align:center;pointer-events:none}

.logo i{display:block;font-family:"Playfair Display",Georgia,serif;font-size:calc(18*var(--u));color:var(--mute);margin-top:calc(2*var(--u))}

/* ---------- categories ---------- */
.cats{left:0;right:0;top:calc(178*var(--u));display:flex;justify-content:center;gap:calc(14*var(--u));transition:opacity .35s,transform .45s}

.head p{margin:calc(14*var(--u)) 0 0;font-size:calc(19*var(--u));color:var(--mute);font-weight:600}
.app:not(.is-detail) .head{opacity:0;transform:translateY(calc(20*var(--u)));pointer-events:none}

/* ---------- pizza zone ---------- */
.pzone{transition:opacity .4s,transform .5s}

.track{position:absolute;left:0;right:0;top:calc(320*var(--u));height:calc(620*var(--u));touch-action:pan-y}
.pz{position:absolute;left:calc(230*var(--u));top:0;width:calc(620*var(--u));height:calc(620*var(--u));transition:transform .75s cubic-bezier(.55,.05,.2,1),opacity .5s;will-change:transform;cursor:pointer}

.pz.hidden{opacity:0;pointer-events:none}

.pc{transform-box:fill-box;transform-origin:center;animation:drop .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{transform:scale(2.4) translateY(-6px);opacity:0}to{transform:none;opacity:1}}

@keyframes shrink{to{transform:scale(0);opacity:0}}

@keyframes float{from{transform:translateY(calc(-10*var(--u))) rotate(-8deg)}to{transform:translateY(calc(12*var(--u))) rotate(10deg)}}

.cui{transition:opacity .4s,transform .5s}

.cname{left:0;right:0;top:calc(985*var(--u));text-align:center}

.pill{height:calc(80*var(--u));padding:0 calc(46*var(--u));border-radius:calc(40*var(--u));background:linear-gradient(90deg,var(--or1),var(--or2));color:#fff;font-size:calc(23*var(--u));font-weight:800;box-shadow:0 calc(12*var(--u)) calc(26*var(--u)) rgba(242,110,40,.3)}
.pill:active{transform:scale(.97)}
.thumbs{left:calc(60*var(--u));right:calc(60*var(--u));top:calc(1380*var(--u));display:flex;justify-content:space-between}
.th{width:calc(170*var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(14*var(--u))}
.th .tc{width:calc(132*var(--u));height:calc(132*var(--u));border-radius:50%;padding:calc(8*var(--u));background:var(--soft);transition:box-shadow .3s,background .3s,transform .3s}
.th .tc svg{width:100%;height:100%;display:block}

.th.on .nm{color:var(--ink)}

/* ---------- grid zone ---------- */
.gzone{left:calc(70*var(--u));right:calc(70*var(--u));top:calc(290*var(--u));bottom:calc(190*var(--u));display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:calc(438*var(--u));gap:calc(28*var(--u));align-content:start;overflow:auto;transition:opacity .35s,transform .45s;scrollbar-width:none}

.app.cat-pizza .gzone{opacity:0;transform:translateX(calc(60*var(--u)));pointer-events:none}
.gzone.swap{opacity:0;transform:translateY(calc(24*var(--u)))}
.card{background:#fff;border-radius:calc(30*var(--u));padding:calc(22*var(--u)) calc(28*var(--u)) calc(26*var(--u));display:flex;flex-direction:column;box-shadow:0 calc(6*var(--u)) calc(24*var(--u)) rgba(120,80,50,.07)}
.card .art{height:calc(220*var(--u));display:grid;place-items:center;overflow:visible}
.card .art svg{height:calc(210*var(--u));width:calc(210*var(--u));overflow:visible;filter:drop-shadow(0 calc(12*var(--u)) calc(14*var(--u)) rgba(90,50,20,.18))}

.card .row{display:flex;align-items:center;justify-content:space-between}

.add{width:calc(64*var(--u));height:calc(64*var(--u));border-radius:50%;background:linear-gradient(135deg,var(--or1),var(--or2));display:grid;place-items:center;color:#fff}
.add svg{width:46%;height:46%}
.mini{display:flex;align-items:center;background:var(--soft);border-radius:calc(32*var(--u));height:calc(64*var(--u))}
.mini button{width:calc(58*var(--u));height:calc(64*var(--u));font-size:calc(30*var(--u));line-height:1}
.mini b{min-width:calc(30*var(--u));text-align:center;font-size:calc(22*var(--u))}

/* ---------- detail ---------- */
.dui{transition:opacity .45s .12s,transform .55s .12s}
.app:not(.is-detail) .dui{opacity:0;transform:translateY(calc(50*var(--u)));pointer-events:none;transition-delay:0s}
.price{left:0;right:0;top:calc(975*var(--u));text-align:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:calc(92*var(--u));line-height:1}
.price .r{font-family:Manrope,sans-serif;font-size:.58em;margin-left:.18em}
.price.bump{animation:bump .4s cubic-bezier(.3,1.7,.5,1)}
@keyframes bump{40%{transform:scale(1.08)}}
.sz{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.sz .c{width:calc(88*var(--u));height:calc(88*var(--u));border-radius:50%;border:calc(1.5*var(--u)) solid var(--line);display:grid;place-items:center;font-size:calc(26*var(--u));font-weight:700;color:var(--mute);transition:all .35s cubic-bezier(.3,1.5,.5,1)}
.sz .l{position:absolute;top:calc(100% + 14*var(--u));font-size:calc(16*var(--u));color:var(--mute);white-space:nowrap;font-weight:500}
.sz.on .c{width:calc(104*var(--u));height:calc(104*var(--u));background:#fff;border-color:#fff;color:var(--or1);font-size:calc(30*var(--u));font-weight:800;box-shadow:0 calc(12*var(--u)) calc(26*var(--u)) rgba(170,110,70,.28)}
.tlabel{left:0;right:0;top:calc(1262*var(--u));text-align:center}
.tlabel b{display:block;font-size:calc(22*var(--u));font-weight:800}
.tlabel i{display:block;margin-top:calc(4*var(--u));font-family:"Playfair Display",Georgia,serif;font-size:calc(19*var(--u));color:var(--mute);transition:color .2s}
.tlabel.warn i{color:var(--or1)}
.tlabel.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(calc(-8*var(--u)))}50%{transform:translateX(calc(8*var(--u)))}75%{transform:translateX(calc(-4*var(--u)))}}
.tp{position:absolute;transform:translate(-50%,calc(-54*var(--u)));width:calc(140*var(--u));display:flex;flex-direction:column;align-items:center}
.tp .c{position:relative;width:calc(108*var(--u));height:calc(108*var(--u));border-radius:50%;background:var(--soft);display:grid;place-items:center;transition:all .3s cubic-bezier(.3,1.5,.5,1)}
.tp .c svg{width:78%;height:78%;overflow:visible}
.tp .n{margin-top:calc(16*var(--u));font-size:calc(17*var(--u));font-weight:600;color:var(--mute)}
.tp .p{margin-top:calc(4*var(--u));font-size:calc(16*var(--u));font-weight:700;color:#bba794}
.tp .ck{position:absolute;right:calc(-4*var(--u));top:calc(-4*var(--u));width:calc(32*var(--u));height:calc(32*var(--u));border-radius:50%;background:var(--or1);display:grid;place-items:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.tp .ck svg{width:60%;height:60%}
.tp.on .c{background:#fff;box-shadow:0 0 0 calc(3*var(--u)) var(--or1),0 calc(10*var(--u)) calc(26*var(--u)) rgba(240,120,50,.3)}
.tp.on .ck{transform:scale(1)}
.tp.on .n{color:var(--ink);font-weight:700}
.tp.on .p{color:var(--or1)}
.crust{left:calc(70*var(--u));right:calc(70*var(--u));top:calc(1648*var(--u));display:flex;align-items:center;justify-content:space-between}
.crust b{font-size:calc(21*var(--u));font-weight:700}
.seg{display:flex;background:var(--soft);border-radius:calc(32*var(--u));padding:calc(6*var(--u));position:relative}
.seg button{position:relative;z-index:1;width:calc(222*var(--u));height:calc(52*var(--u));font-size:calc(18*var(--u));font-weight:600;color:var(--mute);transition:color .3s}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:700}
.seg .knob{position:absolute;top:calc(6*var(--u));left:calc(6*var(--u));width:calc(222*var(--u));height:calc(52*var(--u));border-radius:calc(26*var(--u));background:#fff;box-shadow:0 calc(4*var(--u)) calc(12*var(--u)) rgba(120,80,50,.12);transition:transform .4s cubic-bezier(.4,1.3,.5,1)}
.seg.r .knob{transform:translateX(100%)}

/* ---------- bottom ---------- */
.bottom{left:calc(70*var(--u));right:calc(70*var(--u));top:calc(1762*var(--u));height:calc(108*var(--u))}
.stepper{position:absolute;left:0;top:0;width:calc(260*var(--u));height:100%;border-radius:calc(54*var(--u));background:var(--soft);display:flex;align-items:center;justify-content:space-around;transition:opacity .4s,transform .45s}
.stepper button{width:calc(70*var(--u));height:calc(70*var(--u));border-radius:50%;font-size:calc(36*var(--u));line-height:1;display:grid;place-items:center}
.stepper b{font-size:calc(28*var(--u));min-width:calc(40*var(--u));text-align:center}
.cta{position:absolute;right:0;left:calc(280*var(--u));top:0;height:100%;border-radius:calc(54*var(--u));background:linear-gradient(90deg,var(--or1),var(--or2));color:#fff;display:flex;align-items:center;gap:calc(18*var(--u));padding:0 calc(50*var(--u));font-size:calc(25*var(--u));font-weight:800;box-shadow:0 calc(16*var(--u)) calc(34*var(--u)) rgba(242,110,40,.35);transition:opacity .4s,transform .45s}
.cta:active{transform:scale(.97)}
.cta svg{width:calc(38*var(--u));height:calc(38*var(--u));flex:none}
.cta .t{flex:1;text-align:left}
.app:not(.is-detail) .stepper,.app:not(.is-detail) .cta{opacity:0;transform:translateY(calc(30*var(--u)));pointer-events:none}
.summary{position:absolute;inset:0;border-radius:calc(54*var(--u));background:var(--ink);color:#fff;display:flex;align-items:center;padding:0 calc(14*var(--u)) 0 calc(20*var(--u));gap:calc(20*var(--u));text-align:left;transition:opacity .4s,transform .45s,background .3s}
.summary .n{width:calc(74*var(--u));height:calc(74*var(--u));border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-size:calc(26*var(--u));font-weight:800;flex:none}
.summary .m{flex:1}
.summary .m b{display:block;font-size:calc(23*var(--u))}
.summary .m span{display:block;font-size:calc(17*var(--u));color:#c9b6a6;margin-top:calc(2*var(--u))}
.summary .go{height:calc(80*var(--u));padding:0 calc(38*var(--u));border-radius:calc(40*var(--u));background:linear-gradient(90deg,var(--or1),var(--or2));display:flex;align-items:center;gap:calc(20*var(--u));font-size:calc(22*var(--u));font-weight:800}
.summary.empty{background:var(--soft);color:var(--mute);justify-content:center;cursor:default}
.summary.empty>*:not(.e){display:none}
.summary .e{display:none;font-size:calc(21*var(--u));font-weight:600}
.summary.empty .e{display:block}
.app.is-detail .summary{opacity:0;transform:translateY(calc(30*var(--u)));pointer-events:none}

/* ---------- box ---------- */
.box{position:absolute;left:calc(230*var(--u));top:calc(320*var(--u));width:calc(620*var(--u));height:calc(620*var(--u));perspective:calc(1800*var(--u));pointer-events:none;opacity:0;visibility:hidden}
.box .base,.box .lid{position:absolute;inset:0;border-radius:calc(22*var(--u))}
.box .base{background:#caa06c;box-shadow:inset 0 0 0 calc(18*var(--u)) #b98c55,0 calc(30*var(--u)) calc(50*var(--u)) rgba(90,50,20,.3)}

.stamp{width:62%;aspect-ratio:1;border-radius:50%;border:calc(5*var(--u)) solid #8a5a2e;display:grid;place-items:center;text-align:center;color:#8a5a2e}
.stamp b{font-size:calc(52*var(--u));letter-spacing:.3em;padding-left:.3em;font-weight:800;display:block}

.toast{position:absolute;left:50%;top:calc(1650*var(--u));transform:translate(-50%,calc(20*var(--u)));background:var(--ink);color:#fff;border-radius:calc(40*var(--u));padding:calc(18*var(--u)) calc(34*var(--u));font-size:calc(20*var(--u));font-weight:700;opacity:0;transition:all .35s;z-index:44;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- sheet ---------- */

.ln .tc svg{width:100%;height:100%}
.ln .m{flex:1;min-width:0}

function blob(cx,cy,r,R,k=.15,n=18){const ph=[R()*6.28,R()*6.28],pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const rr=r*(1+k*(Math.sin(3*a+ph[0])*.6+Math.sin(5*a+ph[1])*.4)+(R()-.5)*k*.5);pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)])}
  let d='';for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];if(!i){const z=pts[n-1];d+=`M${((z[0]+p[0])/2).toFixed(1)} ${((z[1]+p[1])/2).toFixed(1)}`}d+=`Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${((p[0]+q[0])/2).toFixed(1)} ${((p[1]+q[1])/2).toFixed(1)}`}return d+'Z'}

function piece(kind,x,y,rot,s,R,cls,extra=''){return `<g ${extra} transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)}) scale(${s})"><g class="${cls||''}">${PC[kind](R)}</g></g>`}
function spiral(n,rad,R,off=0){const o=[];for(let i=0;i<n;i++){const r=rad*Math.sqrt((i+.5)/n)+(R()-.5)*6;const a=i*2.39996+off+(R()-.5)*.4;o.push([r*Math.cos(a),r*Math.sin(a)])}return o}

    return `<div class="ln"><span class="tc">${art}</span><div class="m"><b>${nm}</b><span>${lineDesc(l)}</span></div><span class="mini"><button data-ld="${i}" aria-label="− ${nm}">−</button><b>${l.qty}</b><button data-li="${i}" aria-label="+ ${nm}">+</button></span><span class="pr">${fmt(l.unit*l.qty)} ₽</span></div>`}).join('')
    :`<div class="empty">${t('emptyCart')}</div>`;
  sheet.innerHTML=`<h3>${t('yourOrder')}</h3><p class="sub">${t(st.mode)}</p><div class="lines">${lines}</div><div class="total"><span>${t('total')}</span><b>${fmt(total)} ₽</b></div><div class="sbtns"><button class="btn sec" id="more">${t('more')}</button><button class="btn pri" id="topay" ${st.cart.length?'':'disabled'}>${t('toPay')} · ${fmt(total)} ₽</button></div>`;
  sheet.querySelectorAll('[data-li],[data-ld]').forEach(b=>b.onclick=()=>{const i=+(b.dataset.li??b.dataset.ld),l=st.cart[i];l.qty+=b.dataset.li!==undefined?1:-1;if(l.qty<=0)st.cart.splice(i,1);if(l.kind==='item')refreshCtl(l.item);updateBadge();updateSummary();renderCart()});
  $('more').onclick=closeSheet;$('topay').onclick=renderPay;
}
const ICO={card:'<svg viewBox="0 0 24 24" fill="none" stroke="#f26826" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="6" width="14" height="10" rx="2"/><path d="M2.5 10h14"/><path d="M19.5 8.5a5 5 0 0 1 0 7M21.8 6.5a8 8 0 0 1 0 11"/></svg>',
 qr:'<svg viewBox="0 0 24 24" fill="none" stroke="#f26826" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3h-3zM14 20h2M20 14v2"/></svg>',
 counter:'<svg viewBox="0 0 24 24" fill="none" stroke="#f26826" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="2"/><circle cx="12" cy="12.5" r="2.6"/><path d="M6 10v5M18 10v5"/></svg>'};
const ARR='<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="#96806f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
function renderPay(){
  sheetView='pay';
  sheet.innerHTML=`<h3>${t('payHow')}</h3><p class="sub">${t('total')}: ${fmt(cartTotal())} ₽</p><div class="methods">${['card','qr','counter'].map(m=>`<button class="meth" data-m="${m}"><span class="ic">${ICO[m]}</span><span><b>${t(m)}</b><span>${t(m+'S')}</span></span>${ARR}</button>`).join('')}</div><div class="sbtns"><button class="btn sec" id="pback">${t('back')}</button></div>`;
  sheet.querySelectorAll('.meth').forEach(b=>b.onclick=()=>startPay(b.dataset.m));$('pback').onclick=renderCart;
}
function qrSVG(){const R=rng(st.orderNo*31+cartTotal()),n=25;let s=`<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges">`;
  const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#3c261e"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#3c261e"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const f=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);if(!f&&R()<.5)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#3c261e"/>`}
  return s+fin(0,0)+fin(n-7,0)+fin(0,n-7)+`<rect x="10" y="10" width="5" height="5" rx="1" fill="#f26826"/></svg>`}
function startPay(m){
  const total=cartTotal();
  if(m==='counter'){closeSheet();showDone('counter');return}
  sheetView='paying';const d=m==='card'?3200:5200;
  sheet.innerHTML=`<div class="paystate">${m==='card'?`<div class="ic pulse">${ICO.card}</div><h4>${t('tapCard')}</h4><p>${t('tapCardP',fmt(total))}</p>`:`<div class="qr">${qrSVG()}</div><h4>${t('scanQR')}</h4><p>${t('scanQRP',fmt(total))}</p>`}<div class="bar" style="--d:${RM?600:d}ms"><i></i></div><div class="sbtns"><button class="btn sec" id="pcancel" style="flex:1">${t('cancel')}</button></div></div>`;
  $('pcancel').onclick=()=>{clearTimeout(payTimer);renderPay()};
  payTimer=setTimeout(()=>{closeSheet();showDone(m)},RM?600:d);
}

/* ================= done ================= */
let doneTimer=null,doneLeft=0,doneMethod='card',doneTotal=0;
function renderDoneTexts(){
  $('dtitle').textContent=t(doneMethod==='counter'?'okCounter':'ok');
  $('dinfo').textContent=t(doneMethod==='counter'?'infoCounter':st.mode==='here'?'infoHere':'infoTogo');
  $('dpaid').textContent=t(doneMethod==='counter'?'toPayCounter':doneMethod==='qr'?'paidQR':'paidCard',fmt(doneTotal));
  $('newin').textContent=t('newIn',doneLeft);
}
function showDone(m){
  doneMethod=m;doneTotal=cartTotal();st.orderNo=st.orderNo>=99?11:st.orderNo+1;$('dnum').textContent=st.orderNo;
  $('rprint').setAttribute('aria-pressed','false');$('rnone').setAttribute('aria-pressed','false');$('rprint').textContent=t('print');
  doneLeft=DONE_COUNT;renderDoneTexts();app.classList.add('on-done');
  clearInterval(doneTimer);doneTimer=setInterval(()=>{doneLeft--;$('newin').textContent=t('newIn',doneLeft);if(doneLeft<=0)resetAll()},1000);
  setTimeout(()=>$('newo').focus({preventScroll:true}),400);
}
$('rprint').onclick=()=>{$('rprint').setAttribute('aria-pressed','true');$('rnone').setAttribute('aria-pressed','false');doneLeft=Math.min(doneLeft,8)};
$('rnone').onclick=()=>{$('rnone').setAttribute('aria-pressed','true');$('rprint').setAttribute('aria-pressed','false');doneLeft=Math.min(doneLeft,5)};
$('newo').onclick=()=>resetAll();

/* ================= flow ================= */
function startOrder(m){st.mode=m;renderMode();app.classList.remove('on-attract');poke();setTimeout(()=>$('cats').querySelector('[aria-selected="true"]')?.focus({preventScroll:true}),500)}
document.querySelectorAll('#attract .at-b button').forEach(b=>b.onclick=()=>startOrder(b.dataset.m));
function resetAll(){
  clearInterval(doneTimer);clearTimeout(payTimer);hideIdle();
  if(st.detail){st.busy=false;closeDetail()}
  st.cart=[];st.tops=[];st.idx=0;closeSheet();updateBadge();updateSummary();setCat('pizza');layoutCarousel();
  app.classList.remove('on-done');app.classList.add('on-attract');
}

/* ================= idle ================= */
let last=Date.now(),idleOn=false,idleLeft=0,idleT=null;
function poke(){last=Date.now()}
['pointerdown','keydown'].forEach(ev=>app.addEventListener(ev,()=>{if(!idleOn)poke()},true));
function showIdle(){idleOn=true;idleLeft=IDLE_COUNT;$('idle').classList.add('on');tickIdle();idleT=setInterval(tickIdle,1000);setTimeout(()=>$('icont').focus({preventScroll:true}),50)}
function tickIdle(){$('idlen').textContent=idleLeft;$('idlep').textContent=t('idleP',idleLeft);$('ringc').style.strokeDashoffset=(276.5*(1-idleLeft/IDLE_COUNT)).toFixed(1);if(idleLeft<=0){resetAll();return}idleLeft--}
function hideIdle(){idleOn=false;clearInterval(idleT);$('idle').classList.remove('on');poke()}
$('icont').onclick=hideIdle;$('irest').onclick=resetAll;
setInterval(()=>{const inMenu=!app.classList.contains('on-attract')&&!app.classList.contains('on-done');if(inMenu&&!idleOn&&sheetView!=='paying'&&!st.busy&&Date.now()-last>IDLE_AFTER*1000)showIdle()},1000);

/* ================= keys ================= */
document.addEventListener('keydown',e=>{
  if(idleOn){if(e.key==='Escape')hideIdle();return}
  if(app.classList.contains('sheet-open')){if(e.key==='Escape'&&sheetView!=='paying')closeSheet();return}
  if(app.classList.contains('on-attract')||app.classList.contains('on-done'))return;
  if(st.detail){if(e.key==='Escape')closeDetail();return}
  if(st.cat==='pizza'&&document.activeElement===document.body){if(e.key==='ArrowRight')go(st.idx+1);if(e.key==='ArrowLeft')go(st.idx-1)}
});

setCat('pizza');renderTexts();updateBadge();
})();
</script>
</body>
</html>
