<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liefersoft · Prototype Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23111'/><circle cx='50' cy='50' r='26' fill='%23f2a33a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0d0c;--bg-2:#161412;--card:#1c1917;--line:#2a2623;--ink:#f3ede6;--ink-2:#a8a097;--ink-3:#6f6862;--accent:#f2a33a;--ff-d:"Fraunces",Georgia,serif;--ff:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);-webkit-font-smoothing:antialiased;min-height:100%;padding-bottom:80px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
header{padding:48px 0 28px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:44px;height:44px;border-radius:13px;background:#fff;display:grid;place-items:center}
.mark i{width:24px;height:24px;border-radius:50%;background:var(--accent);display:block;box-shadow:inset -6px -4px 0 #d9862a}
h1{font-family:var(--ff-d);font-weight:500;font-size:34px;letter-spacing:-.02em;line-height:1}
.brand p{color:var(--ink-2);font-size:13px;margin-top:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);font-size:13px;cursor:pointer;background:none;font:inherit;transition:.2s}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-3px);border-color:#3a3430}
.shot{position:relative;aspect-ratio:4/5;background:var(--bg-2);overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .6s}
.card:hover .shot img{transform:scale(1.03)}
.shot.kiosk img{object-fit:contain;padding:18px 18px 0}
.shot.mobile img{object-fit:cover}
.badge{position:absolute;top:14px;left:14px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:rgba(14,13,12,.75);backdrop-filter:blur(8px);color:var(--ink)}
.status{position:absolute;top:14px;right:14px;font-size:11px;padding:6px 10px;border-radius:999px;background:rgba(14,13,12,.75);backdrop-filter:blur(8px);color:var(--ink-2)}
.status::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.body{padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.client{font-size:12px;color:var(--ink-2)}
.title{font-family:var(--ff-d);font-size:22px;font-weight:500;letter-spacing:-.01em;line-height:1.1}
.desc{font-size:13px;color:var(--ink-2);line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tags span{font-size:11px;color:var(--ink-3);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:12px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:13px;transition:.2s}
.btn:hover{background:var(--accent)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-2);font-weight:500}
.btn.ghost:hover{border-color:var(--ink-3);color:var(--ink)}
.meta{font-size:11px;color:var(--ink-3);padding-top:6px}
footer{margin-top:60px;color:var(--ink-3);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.empty{color:var(--ink-3);padding:60px 0;text-align:center}
@media (max-width:600px){header{padding-top:32px}h1{font-size:28px}.grid{grid-template-columns:1fr 1fr;gap:12px}.body{padding:14px}.title{font-size:18px}.desc{display:none}.tags{display:none}.btn{height:36px;padding:0 12px;font-size:12px}}
@media (max-width:400px){.grid{grid-template-columns:1fr}.desc,.tags{display:flex}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark"><i></i></div>
      <div><h1>Prototype Studio</h1><p>Liefersoft · klickbare Prototypen für Self-Order, Mobile & QR-Bestellung</p></div>
    </div>
    <div class="filters" id="filters"></div>
  </header>
  <div class="grid" id="grid"></div>
  <footer><span id="count"></span><span>Intern · nicht zur Veröffentlichung · Stand <span id="stamp"></span></span></footer>
</div>
<script>
const TYPES=["Alle","Kiosk","Mobile App","QR-Tischbestellung"];let cur="Alle",DATA=[];
const F=document.getElementById("filters");
TYPES.forEach(t=>{const b=document.createElement("button");b.className="chip"+(t==="Alle"?" on":"");b.textContent=t;b.onclick=()=>{cur=t;[...F.children].forEach(c=>c.classList.toggle("on",c===b));render()};F.appendChild(b)});
function render(){
  const list=DATA.filter(p=>cur==="Alle"||p.type===cur);
  document.getElementById("count").textContent=`${list.length} Prototyp${list.length===1?"":"en"}`;
  const g=document.getElementById("grid");
  if(!list.length){g.innerHTML=`<div class="empty">Noch nichts in dieser Kategorie.</div>`;return}
  g.innerHTML=list.map(p=>`<article class="card">
    <a class="shot ${p.type==="Kiosk"?"kiosk":"mobile"}" href="${p.variants[0].path}"><img src="thumbs/${p.slug}.jpg" alt="" loading="lazy" onerror="this.style.display='none'"><span class="badge">${p.type}</span><span class="status">${p.status}</span></a>
    <div class="body">
      <div class="client">${p.client} · ${p.city}</div>
      <div class="title">${p.title}</div>
      <div class="desc">${p.desc}</div>
      <div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join("")}</div>
      <div class="actions">${p.variants.map((v,i)=>`<a class="btn ${i?"ghost":""}" href="${v.path}">${i?"":"▶ "}${i?v.name:"Öffnen"+(p.variants.length>1?" · "+v.name:"")}</a>`).join("")}</div>
      <div class="meta">Aktualisiert ${p.updated}</div>
    </div></article>`).join("");
}
fetch("projects.json?"+Date.now()).then(r=>r.json()).then(d=>{DATA=d;document.getElementById("stamp").textContent=d.map(p=>p.updated).sort().pop();render()});
</script>
</body>
</html>
