<style>/* Da Enzo SOT — Skin A. Canonical stage 1080×1920 (scaled uniformly by app.js). Proportions from the 9-screen board. */
:root { --bg: #121212; --surface: #1c1c1c; --surface2: #242424; --line: rgba(255,255,255,.10); --text: #ffffff; --text2: #c7c7c7; --muted: #9a9a9a;
  --green: #4f7d2c; --green2: #3f6a22; --yellow: #f7d63f; --yellow2: #e7c42e; --red: #ce2b37;
  --disp: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; --ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: var(--ui); color: var(--text); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
img { display: block; }
#app { position: fixed; inset: 0; }
#stage { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; transform-origin: 50% 50%; overflow: hidden; background: var(--bg); }
.scr { position: absolute; inset: 0; background: radial-gradient(120% 60% at 50% 0%, #1f1f1f 0%, #121212 60%); overflow: hidden; }
.noimg { display: block; width: 100%; height: 100%; background: var(--surface2); }
[aria-disabled='true'], [disabled] { cursor: default; }
@media (prefers-reduced-motion: no-preference) { button { transition: transform 120ms ease, background-color 160ms ease, border-color 160ms ease; } button:not([aria-disabled='true']):not([disabled]):active { transform: scale(.97); } }
h1 { margin: 0; font-family: var(--disp); font-weight: 700; letter-spacing: -.5px; }
.heart { position: absolute; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: rgba(10,10,10,.65); color: #fff; }
.heart svg { width: 34px; height: 34px; }
.go { position: absolute; right: 26px; bottom: 26px; width: 84px; height: 84px; border-radius: 50%; background: var(--yellow); color: #1b1b1b; display: grid; place-items: center; }
.go svg { width: 40px; height: 40px; }

/* logo */
.logo { display: flex; flex-direction: column; align-items: center; color: #fff; }
.logo .lp { font: 600 26px/1 var(--ui); letter-spacing: 10px; margin-left: 10px; }
.logo .lw { font: italic 700 124px/1 var(--disp); margin-top: 6px; letter-spacing: -1px; }
.logo .lf { display: flex; width: 210px; height: 6px; margin-top: 6px; } .logo .lf i { flex: 1; } .logo .lf i:nth-child(1) { background: #009246; } .logo .lf i:nth-child(2) { background: #fff; } .logo .lf i:nth-child(3) { background: var(--red); }
.logo .ly { font: 600 22px/1 var(--ui); letter-spacing: 6px; margin-top: 12px; color: var(--text2); }

/* 01 start */
.s01 .bg { position: absolute; inset: 0; } .s01 .hero { position: absolute; left: 70px; top: 300px; width: 940px; height: 780px; object-fit: cover; border-radius: 50% / 46%; }
.s01 .decor, .s09 .decor { position: absolute; right: -40px; top: 0; width: 560px; height: 400px; object-fit: cover; opacity: .75; -webkit-mask-image: linear-gradient(to left, #000 50%, transparent); mask-image: linear-gradient(to left, #000 50%, transparent); }
.s01 .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,18,18,.65) 0%, rgba(18,18,18,0) 16%, rgba(18,18,18,0) 46%, rgba(18,18,18,.92) 60%, #121212 70%); }
.s01 .logo { position: absolute; left: 0; right: 0; top: 96px; }
.w-copy { position: absolute; left: 0; right: 0; top: 1150px; text-align: center; }
.w-copy h1 { font-size: 116px; line-height: 104px; }
.w-copy p { margin: 34px 0 0; font: 400 38px/52px var(--ui); color: var(--text2); }
.modes { position: absolute; left: 60px; right: 60px; top: 1500px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.mode { height: 200px; border-radius: 28px; display: flex; align-items: center; gap: 28px; padding: 0 40px; background: var(--surface2); border: 2px solid var(--line); }
.mode.eat { background: var(--green); border-color: #6c9a45; }
.mode svg { width: 92px; height: 92px; flex: none; } .mode b { display: block; font: 700 40px/1.1 var(--ui); } .mode small { display: block; margin-top: 8px; font: 400 28px/1 var(--ui); color: rgba(255,255,255,.85); }
.langs { position: absolute; left: 60px; right: 60px; top: 1760px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.lang { height: 92px; border-radius: 46px; display: flex; align-items: center; justify-content: center; gap: 16px; background: #0d0d0d; border: 2px solid var(--line); font: 500 30px/1 var(--ui); }
.lang svg { width: 40px; height: 40px; } .lang.on { border-color: #fff; } .lang[aria-disabled='true'] { opacity: .55; }

/* rail + main */
.withrail .rail { position: absolute; left: 24px; top: 40px; bottom: 40px; width: 176px; display: flex; flex-direction: column; gap: 18px; }

.s08 .sum { top: 1080px; padding: 40px; border-radius: 28px; background: var(--surface); border: 2px solid var(--line); }
.demo { position: absolute; left: 0; right: 0; top: 1430px; text-align: center; font: 400 28px/1 var(--ui); color: var(--muted); }

@media (prefers-reduced-motion: no-preference) { .s09 .ok { animation: pop 520ms cubic-bezier(.2,.8,.3,1.3) both; } }

        ${p.deposit ? `<span class="cx">+ Pfand</span><span class="cxp">${eur(p.deposit * l.qty)}</span>` : ''}</div>`; };
    return `<section class="scr s06" data-screen="06"><header class="ch"><h1>Deine Bestellung</h1><button type="button" class="clear" data-act="clear" ${S.cart.length ? '' : 'aria-disabled="true"'}>${I.trash}<span>Bestellung leeren</span></button></header>
      <div class="clist">${S.cart.length ? S.cart.map(row).join('') : '<p class="empty">Dein Warenkorb ist leer.</p>'}</div>
      <button type="button" class="addmore" data-act="go" data-to="/menu">${I.plus}<span>Weiteres Gericht hinzufügen</span></button>
      <div class="sum"><div><span>Warenwert</span><span>${eur(t.goods)}</span></div><div><span>Pfand</span><span>${eur(t.deposit)}</span></div><div class="tot"><span>Gesamtbetrag</span><span>${eur(t.total)}</span></div></div>
      <button type="button" class="cta" data-act="go" data-to="/pay" ${S.cart.length ? '' : 'disabled'}>${I.cart}<span>Zur Kasse</span><b>${eur(t.total)}</b><i>${I.chev}</i></button></section>`;
  }
  function s08() {
    const t = totals();
    const m = (id, ic, title, sub) => `<button type="button" class="pm ${S.pay === id ? 'on' : ''}" data-act="paym" data-m="${id}" aria-pressed="${S.pay === id}">${ic}<span><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</span></button>`;
    return `<section class="scr s08" data-screen="08"><button type="button" class="pillback" data-act="go" data-to="/cart">${I.back}<span>Zurück</span></button>
      <div class="x-copy"><h1>Zahlungsart wählen</h1><p>Sicher, schnell und einfach bezahlen.</p></div>
      <div class="pms">${m('card', I.nfc, 'Karte / NFC', 'Kontaktlos bezahlen')}${m('apple', I.apple, 'Apple Pay')}${m('google', '<span class="gp"><i>G</i>Pay</span>', 'Google Pay')}</div>
      <div class="sum"><div><span>Warenwert</span><span>${eur(t.goods)}</span></div><div><span>Pfand</span><span>${eur(t.deposit)}</span></div><div class="tot"><span>Gesamtbetrag</span><span>${eur(t.total)}</span></div></div>
      <p class="demo">Demo-Zahlung · es wird nichts belastet</p>
      <button type="button" class="cta" data-act="pay" ${S.cart.length && !S.busy ? '' : 'disabled'}>${I.lock}<span>${S.busy ? 'Zahlung läuft …' : 'Jetzt bezahlen'}</span><b>${eur(t.total)}</b><i>${I.chev}</i></button></section>`;
  }
  function s09() {
    const c = S.confirmation;
    return `<section class="scr s09" data-screen="09"><div class="bg">${img('decor-top', 'decor')}</div>${logo('big')}
      <span class="ok">${I.check}</span><h1>Bestellung erfolgreich!</h1><p class="lab">Deine Bestellnummer</p><p class="num">#${c.number}</p><p class="amt">${eur(c.total)}</p>
      <p class="msg">Wir bereiten deine Bestellung<br>jetzt frisch zu.</p>
      <button type="button" class="cta green" data-act="restart">${I.home}<span>Zur Startseite</span><i>${I.chev}</i></button></section>`;
  }

  /* ---------- router + render ---------- */
  const SCREENS = { '/': s01, '/menu': s02, '/cat': () => s03(S.cat || 'pizza'), '/product': s04, '/extras': s05, '/more': s07, '/cart': s06, '/pay': s08, '/done': s09 };
  const history = [];
  function go(to, { push = true } = {}) { if (push && S.route !== to) history.push(S.route); S.route = to; render(true); }
  let current = null;
  function render(animate = false) {
    const tmp = document.createElement('div'); tmp.innerHTML = SCREENS[S.route]().trim(); const next = tmp.firstElementChild;
    const prev = current; stage.appendChild(next); current = next;
    if (prev) {
      if (animate && !reduced()) {
        next.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'cubic-bezier(.2,.7,.2,1)' });
        prev.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, fill: 'forwards' }).onfinish = () => prev.remove();
      } else if (animate) { next.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 120 }); prev.remove(); } else prev.remove();
    }
  }
  const bump = (sel) => { const q = current.querySelector(sel); if (q && !reduced()) q.animate([{ transform: 'scale(.8)' }, { transform: 'scale(1)' }], { duration: 160, easing: 'cubic-bezier(.2,.8,.3,1.4)' }); };
  function act(el) {
    const a = el.dataset.act; if (!a || el.getAttribute('aria-disabled') === 'true' || el.disabled) return;
    switch (a) {
      case 'go': go(el.dataset.to); break;
      case 'back': go(history.pop() || '/menu', { push: false }); break;
      case 'mode': S.mode = el.dataset.mode; go('/menu'); break;
      case 'cat': S.cat = el.dataset.cat; go('/cat'); break;
      case 'listsize': S.list.size = el.dataset.size; render(); break;
      case 'open': { const p = P(el.dataset.pid); const want = S.route === '/cat' && S.list.size === 'jumbo' && p.sizes.some((s) => s.id === 'jumbo') ? 'jumbo' : p.sizes[0].id;
        S.draft = { pid: p.id, size: want, qty: 1, extras: [] }; S.showAllExtras = false; go('/product'); break; }
      case 'size': S.draft.size = el.dataset.size; render(); break;
      case 'dqty': S.draft.qty = Math.max(1, S.draft.qty + Number(el.dataset.d)); render(); bump('[data-qty]'); break;
      case 'toextras': go('/extras'); break;
      case 'extra': { const x = el.dataset.x; const i = S.draft.extras.indexOf(x); if (i >= 0) S.draft.extras.splice(i, 1); else S.draft.extras.push(x);
        S.draft.extras.sort((m, n) => CAT.extras.findIndex((e) => e.id === m) - CAT.extras.findIndex((e) => e.id === n)); render(); break; }
      case 'allextras': S.showAllExtras = true; render(); break;
      case 'addpizza': addLine(S.draft.pid, S.draft.size, S.draft.extras, S.draft.qty); S.draft = null; go('/more'); break;
      case 'adddirect': addLine(S.draft.pid, S.draft.size, [], S.draft.qty); S.draft = null; go('/cart'); break;
      case 'addrec': { addLine(el.dataset.pid, 'std'); render(); const b = current.querySelector(`[data-pid="${el.dataset.pid}"]`); if (b && !reduced()) b.animate([{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 220 }); break; }
      case 'lqty': { const l = S.cart.find((x) => x.id === el.dataset.id); const q = l.qty + Number(el.dataset.d); if (q < 1) S.cart = S.cart.filter((x) => x !== l); else l.qty = q; render(); break; }
      case 'ldel': S.cart = S.cart.filter((x) => x.id !== el.dataset.id); render(); break;
      case 'clear': S.cart = []; render(); break;
      case 'paym': S.pay = el.dataset.m; render(); break;
      case 'pay': { S.busy = true; render(); setTimeout(() => { const t = totals(); S.confirmation = { number: CAT.orderNumber, total: t.total, method: S.pay, lines: S.cart.map((l) => ({ ...l })) }; S.busy = false; go('/done'); }, reduced() ? 300 : 900); break; }
      case 'restart': reset(); history.length = 0; render(true); break;
      default: break;
    }
  }
  app.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el && app.contains(el)) act(el); });

  /* ---------- uniform kiosk scaling (1080×1920 canonical, letterboxed; no reflow) ---------- */
  const fit = () => { const s = Math.min(innerWidth / 1080, innerHeight / 1920); stage.style.transform = `translate(-50%, -50%) scale(${s})`; };
  addEventListener('resize', fit);

  /* ---------- deterministic demo states (showroom / QA only, not guest UI) ---------- */
  const FIX = {
    'enzo-01': () => {}, 'enzo-02': () => { S.route = '/menu'; }, 'enzo-03': () => { S.cat = 'pizza'; S.route = '/cat'; },
    'enzo-04': () => { S.draft = { pid: 'margherita', size: 'normal', qty: 1, extras: [] }; S.route = '/product'; },
    'enzo-05': () => { S.draft = { pid: 'margherita', size: 'normal', qty: 1, extras: ['peperoni'] }; S.route = '/extras'; },
    'enzo-06': () => { addLine('margherita', 'normal', ['peperoni']); addLine('insalata-mista', 'std'); addLine('coca-cola', 'std'); S.route = '/cart'; },
    'enzo-07': () => { addLine('margherita', 'normal', ['peperoni']); S.route = '/more'; },
    'enzo-08': () => { addLine('margherita', 'normal', ['peperoni']); addLine('insalata-mista', 'std'); addLine('coca-cola', 'std'); S.route = '/pay'; },
    'enzo-09': () => { addLine('margherita', 'normal', ['peperoni']); addLine('insalata-mista', 'std'); addLine('coca-cola', 'std'); S.confirmation = { number: CAT.orderNumber, total: totals().total }; S.route = '/done'; },
  };
  window.__daenzo = {
    fixtures: Object.keys(FIX),
    fixture: (n) => { reset(); history.length = 0; FIX[n](); render(); return n; },
    reset: () => { reset(); history.length = 0; render(); },
    state: () => ({ route: S.route, mode: S.mode, cart: S.cart.map((l) => ({ pid: l.pid, size: l.size, extras: l.extras.slice(), qty: l.qty, unit: lineUnit(l) })), totals: totals(), pay: S.pay, confirmation: S.confirmation }),
  };
  reset(); fit(); render();
})();
</script>
</body>
</html>
