<style>/* Das Eislädchen — Konzept B „Build your Cup“. Mobile-first (canonical 390×844); on wider screens the shop stays a
 * centred mobile column (no desktop redesign). Palette from the concept board: cream/rose surfaces, berry, pink accent. */
:root { --bg: #fbefe9; --bg2: #f8dfdc; --card: #fff8f5; --line: #efd2cf; --text: #2b1d1f; --text2: #6f5a5c; --berry: #8b2547; --berry2: #741c3b; --pink: #ee5d8b;
  --disp: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; --ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: #f3e2dc; font-family: var(--ui); color: var(--text); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
img { display: block; }
#app { position: relative; max-width: 430px; min-height: 100vh; margin: 0 auto; background: var(--bg); overflow: hidden; }
@media (min-width: 600px) { #app { box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 30px 80px rgba(120,60,60,.18); } }
.scr { position: absolute; inset: 0; overflow-y: auto; padding: calc(var(--sat) + 8px) 0 calc(var(--sab) + 120px); background: var(--bg); }
.noimg { display: block; width: 100%; height: 100%; background: var(--bg2); }
[aria-disabled='true'], [disabled] { cursor: default; }
@media (prefers-reduced-motion: no-preference) { button { transition: transform 120ms ease, background-color 160ms ease, border-color 160ms ease; } button:not([aria-disabled='true']):not([disabled]):active { transform: scale(.97); } }
html.no-motion *, html.no-motion *::before, html.no-motion *::after { animation: none !important; transition: none !important; }

.hd { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 60px; padding: 0 14px; }
.hb { width: 44px; height: 44px; display: grid; place-items: center; color: var(--text); } .hb svg { width: 24px; height: 24px; }
.logo { display: flex; flex-direction: column; align-items: center; color: var(--text); }
.logo i { width: 24px; height: 21px; color: var(--berry); margin-bottom: -2px; } .logo i svg { width: 100%; height: 100%; display: block; }
.logo b { font: italic 700 23px/1 var(--disp); letter-spacing: -.2px; } .logo small { font: 600 7.5px/1 var(--ui); letter-spacing: 2.6px; margin-top: 3px; color: var(--text2); }

/* home */
.hero { position: relative; margin: 6px 12px 0; height: 470px; border-radius: 26px; background: linear-gradient(180deg, #fde7e7 0%, #f8d3da 100%); overflow: hidden; }
.hero h1 { position: absolute; left: 22px; top: 22px; margin: 0; font: 700 40px/1.05 var(--disp); }
.hero h1 small { display: block; font: 700 28px/1.2 var(--disp); }
.swoosh { position: absolute; left: 22px; top: 122px; width: 150px; height: 6px; border-radius: 3px; background: var(--pink); transform: rotate(-4deg); opacity: .8; }
.hh { position: absolute; right: 30px; top: 104px; width: 46px; height: 46px; color: var(--pink); } .hh svg { width: 100%; height: 100%; }
.himg { position: absolute; left: 0; right: 0; bottom: 64px; height: 300px; } .himg img { width: 100%; height: 100%; object-fit: cover; }
.hcta { position: absolute; left: 14px; right: 40px; bottom: 16px; height: 68px; border-radius: 34px; background: var(--pink); color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 20px 0 8px; font: 600 16px/1.2 var(--ui); box-shadow: 0 10px 22px rgba(238,93,139,.35); }
.hcta .hthumb { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; flex: none; } .hcta .hthumb img { width: 100%; height: 100%; object-fit: cover; }
.hcta span:nth-child(2) { flex: 1; text-align: center; } .hcta svg { width: 22px; height: 22px; }
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 14px 0; }
.cat { height: 112px; border-radius: 20px; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font: 600 14px/1.15 var(--ui); text-align: center; color: var(--text); box-shadow: 0 2px 8px rgba(140,70,70,.06); }
.cat svg { width: 36px; height: 36px; } .cat:nth-child(4) { grid-column: 2; } .cat[aria-disabled='true'] { opacity: .45; }

/* builder */
h2 { margin: 6px 20px 0; text-align: center; font: 700 26px/1.15 var(--disp); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 40px 0; }
.seg button { height: 44px; border-radius: 22px; background: var(--card); border: 1.5px solid var(--line); font: 600 15px/1 var(--ui); }
.seg button.on { background: var(--berry); border-color: var(--berry); color: #fff; }
.cup { position: relative; width: 210px; height: 260px; margin: 16px auto 0; } .cup img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.scoopdots { position: absolute; left: 0; right: 0; bottom: -6px; display: flex; justify-content: center; gap: 6px; }
.scoopdots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--berry); } .scoopdots i.f { background: var(--berry); }
.count { display: flex; align-items: center; justify-content: space-between; width: 230px; height: 56px; margin: 22px auto 0; padding: 0 10px; border-radius: 28px; border: 2px solid var(--pink); background: #fff; }
.count button { width: 40px; height: 40px; display: grid; place-items: center; color: var(--text); } .count button svg { width: 22px; height: 22px; } .count button[aria-disabled='true'] { opacity: .3; }
.count b { font: 700 19px/1 var(--ui); }
.hint { margin: 10px 0 0; text-align: center; font: 500 13px/1 var(--ui); color: var(--text2); }
.flavors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 12px 0; }
.fl { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.fi { position: relative; width: 92px; height: 92px; border-radius: 50%; overflow: visible; border: 3px solid transparent; }
.fi img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; } .fl.on .fi { border-color: var(--berry); }
.badge { position: absolute; right: -4px; top: -4px; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; background: var(--text); color: #fff; display: grid; place-items: center; font: 700 13px/1 var(--ui); }
.badge svg { width: 16px; height: 16px; }
.fn { font: 600 14px/1.2 var(--ui); text-align: center; }
.undo { display: block; margin: 14px auto 0; font: 500 13px/1 var(--ui); color: var(--berry); text-decoration: underline; text-underline-offset: 3px; }
.cta { position: absolute; left: 18px; right: 18px; bottom: calc(var(--sab) + 18px); height: 58px; border-radius: 29px; background: var(--berry); color: #fff; display: flex; align-items: center; justify-content: center; gap: 12px; font: 600 17px/1 var(--ui); box-shadow: 0 10px 24px rgba(139,37,71,.3); }
.cta svg { width: 22px; height: 22px; } .cta[disabled], .cta[aria-disabled='true'] { opacity: .45; box-shadow: none; }
.builder .cta, .spag .cta, .cart .cta { position: fixed; left: 50%; right: auto; width: min(394px, calc(100% - 36px)); transform: translateX(-50%); }

/* spaghetti */
.pimg { position: relative; margin: 4px 12px 0; height: 280px; border-radius: 24px; overflow: hidden; background: #f8dada; } .pimg img { width: 100%; height: 100%; object-fit: cover; }
.ph { position: absolute; right: 16px; top: 14px; width: 30px; height: 30px; color: var(--text); } .ph svg { width: 100%; height: 100%; }
.spag h2 { margin-top: 22px; font-size: 30px; }
.pd { margin: 12px 22px 0; font: 400 15px/1.5 var(--ui); color: var(--text2); text-align: left; }
.pp { margin: 14px 22px 0; font: 700 30px/1 var(--disp); }
.vars { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 18px 0; }
.var { height: 96px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 14px/1.25 var(--ui); text-align: center; }
.var b { font: 600 15px/1 var(--ui); }

/* cart */
.cart h2 { text-align: left; margin-left: 22px; font-size: 30px; }
.lines { display: flex; flex-direction: column; gap: 12px; margin: 18px 14px 0; }
.line { display: grid; grid-template-columns: 72px 1fr auto; column-gap: 12px; row-gap: 10px; align-items: center; padding: 12px; border-radius: 20px; background: var(--card); box-shadow: 0 2px 8px rgba(140,70,70,.06); }
.li { width: 72px; height: 72px; border-radius: 14px; overflow: hidden; background: #fde9e9; } .li img { width: 100%; height: 100%; object-fit: cover; }
.lt b { display: block; font: 600 15px/1.2 var(--ui); } .lt small { display: block; margin-top: 4px; font: 400 13px/1.3 var(--ui); color: var(--text2); } .lt em { display: block; margin-top: 6px; font: 700 15px/1 var(--ui); font-style: normal; color: var(--berry); }
.lq { display: flex; align-items: center; gap: 8px; } .lq button { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; } .lq svg { width: 16px; height: 16px; } .lq span { font: 600 15px/1 var(--ui); min-width: 16px; text-align: center; }
.upsell { grid-column: 1 / -1; height: 42px; border-radius: 21px; border: 1.5px dashed var(--pink); color: var(--berry); display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 14px/1 var(--ui); background: #fff1f4; }
.upsell svg { width: 16px; height: 16px; }
.ghost { display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 28px); height: 50px; margin: 14px 14px 0; border-radius: 25px; border: 1.5px solid var(--line); font: 600 14px/1 var(--ui); color: var(--berry); } .ghost svg { width: 18px; height: 18px; }
.total { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 24px 0; } .total span { font: 500 17px/1 var(--ui); } .total b { font: 700 26px/1 var(--disp); }
.note { margin: 10px 24px 0; font: 400 12px/1.3 var(--ui); color: var(--text2); text-align: center; }
.empty { text-align: center; color: var(--text2); margin: 30px 0; }

/* fixed mobile cart access */
.cartbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 16px); width: min(394px, calc(100% - 36px)); height: 58px; border-radius: 29px; background: var(--berry); color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 20px; font: 600 15px/1 var(--ui); box-shadow: 0 10px 24px rgba(139,37,71,.3); z-index: 5; }
.cartbar svg { width: 22px; height: 22px; } .cartbar b { margin-left: auto; font-size: 17px; } .cartbar i svg { display: block; }
.cup img { -webkit-mask-image: radial-gradient(ellipse 62% 58% at 50% 52%, #000 70%, transparent 100%); mask-image: radial-gradient(ellipse 62% 58% at 50% 52%, #000 70%, transparent 100%); }
.himg { -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 18%); mask-image: linear-gradient(180deg, transparent 0%, #000 18%); }
</style>

    minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 6.5h16M9.5 6.5V4h5v2.5M6 6.5l1 13.5h10l1-13.5M10 10.5v6M14 10.5v6"/></svg>',
    bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/></svg>',
    logoHeart: '<svg viewBox="0 0 32 28" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 25S3 17 3 9.5C3 5.4 6 3 9.3 3c2.7 0 4.8 1.7 6.7 4 1.9-2.3 4-4 6.7-4C26 3 29 5.4 29 9.5 29 17 16 25 16 25z"/><path d="M11 9c1.5 2.5 3 3.5 5 4 2-.5 3.5-1.5 5-4" stroke-width="1.6"/></svg>',
    cat: {
      spaghetti: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 22h22l-3 5H8zM9 22c0-6 3-11 7-11s7 5 7 11M12 22c0-4 2-8 4-8s4 4 4 8M16 11V7"/><circle cx="16" cy="6" r="1.4"/></svg>',
      classic: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 18h18M8 18a8 8 0 0116 0"/><path d="M9 18l3 9h8l3-9" stroke-linejoin="round"/></svg>',
      kids: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="16" cy="16" r="11"/><path d="M12 14h.01M20 14h.01M11 19c3 3 7 3 10 0"/></svg>',
      hot: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14h17v6a6 6 0 01-6 6h-5a6 6 0 01-6-6zM23 16h2a3 3 0 010 6h-2M11 5c-1 2 1 3 0 5M15 5c-1 2 1 3 0 5M19 5c-1 2 1 3 0 5"/></svg>',
    },
  };
  const logo = () => `<span class="logo" aria-label="Das Eislädchen Hannover"><i>${I.logoHeart}</i><b>Das Eislädchen</b><small>HANNOVER</small></span>`;

  /* ---------- state (presentation-independent) ---------- */
  let S;
  const newBuilder = () => ({ container: 'becher', scoops: 2, slots: [] });
  const reset = () => { S = { route: '/', builder: newBuilder(), spaghetti: { variant: 'pistazien' }, cart: [], next: 1, toast: null }; };
  const builderPrice = (b) => b.scoops * CAT.scoopPrice;
  const builderValid = (b) => b.slots.length === b.scoops;
  const lineUnit = (l) => (l.kind === 'cup' ? l.scoops * CAT.scoopPrice : CAT.spaghetti.variants.find((v) => v.id === l.variant).price);
  const totals = () => ({ count: S.cart.reduce((n, l) => n + l.qty, 0), amount: S.cart.reduce((n, l) => n + lineUnit(l) * l.qty, 0) });

  /* ---------- screens ---------- */
  const top = (back) => `<header class="hd">${back ? `<button type="button" class="hb" data-act="go" data-to="${back}" aria-label="Zurück">${I.back}</button>` : `<span class="hb" aria-hidden="true">${I.menu}</span>`}${logo()}<span class="hb"></span></header>`;
  const cartBar = () => { const t = totals(); return t.count ? `<button type="button" class="cartbar" data-act="go" data-to="/cart">${I.bag}<span>${t.count} ${t.count === 1 ? 'Artikel' : 'Artikel'}</span><b>${eur(t.amount)}</b><i>${I.arrow}</i></button>` : ''; };
  function home() {
    return `<section class="scr home" data-screen="home">${top(null)}
      <div class="hero"><h1>Dein Eis.<small>So wie du es magst.</small></h1><span class="swoosh"></span><span class="hh">${I.heart}</span>
        <div class="himg">${img('hero-cone')}</div>
        <button type="button" class="hcta" data-act="go" data-to="/builder"><span class="hthumb">${img('flavor-pistazien')}</span><span>Mein Eis<br>zusammenstellen</span>${I.arrow}</button></div>
      <div class="cats">${CAT.categories.map((c) => `<button type="button" class="cat" ${c.target ? `data-act="go" data-to="/${c.target}"` : 'aria-disabled="true"'}>${I.cat[c.icon]}<span>${esc(c.label)}</span></button>`).join('')}</div>
      ${cartBar()}</section>`;
  }
  function builder() {
    const b = S.builder; const counts = {}; b.slots.forEach((f) => { counts[f] = (counts[f] || 0) + 1; });
    const ok = builderValid(b);
    return `<section class="scr builder" data-screen="builder">${top('/')}
      <h2>Mein Eis zusammenstellen</h2>
      <div class="seg" role="radiogroup" aria-label="Behälter">${CAT.containers.map((c) => `<button type="button" role="radio" aria-checked="${b.container === c.id}" class="${b.container === c.id ? 'on' : ''}" data-act="container" data-c="${c.id}">${c.label}</button>`).join('')}</div>
      <div class="cup">${img('cup')}<span class="scoopdots" aria-hidden="true">${Array.from({ length: b.scoops }, (_, i) => `<i class="${b.slots[i] ? 'f' : ''}"></i>`).join('')}</span></div>
      <div class="count"><button type="button" data-act="scoops" data-d="-1" ${b.scoops <= CAT.minScoops ? 'aria-disabled="true"' : ''} aria-label="Eine Kugel weniger">${I.minus}</button><b data-qty>${b.scoops} ${b.scoops === 1 ? 'Kugel' : 'Kugeln'}</b><button type="button" data-act="scoops" data-d="1" ${b.scoops >= CAT.maxScoops ? 'aria-disabled="true"' : ''} aria-label="Eine Kugel mehr">${I.plus}</button></div>
      <p class="hint">${b.slots.length} von ${b.scoops} Kugeln gewählt · ${eur(builderPrice(b))}</p>
      <div class="flavors">${CAT.flavors.map((f) => { const n = counts[f.id] || 0; return `<button type="button" class="fl ${n ? 'on' : ''}" data-act="flavor" data-f="${f.id}" aria-pressed="${!!n}">
          <span class="fi">${img(f.img)}${n ? `<span class="badge">${n > 1 ? `×${n}` : I.check}</span>` : ''}</span><span class="fn">${esc(f.name)}</span></button>`; }).join('')}</div>
      ${b.slots.length ? '<button type="button" class="undo" data-act="undo">Letzte Kugel entfernen</button>' : ''}
      <button type="button" class="cta" data-act="addcup" ${ok ? '' : 'disabled'}>In den Becher · ${eur(builderPrice(b))}${I.arrow}</button></section>`;
  }
  function spaghetti() {
    const p = CAT.spaghetti; const v = p.variants.find((x) => x.id === S.spaghetti.variant);
    return `<section class="scr spag" data-screen="spaghetti">${top('/')}
      <div class="pimg">${img(p.img)}<span class="ph" aria-hidden="true">${I.heart}</span></div>
      <h2>${esc(v.label)}</h2><p class="pd">${esc(p.desc)}</p><p class="pp">${eur(v.price)}</p>
      <div class="vars">${p.variants.filter((x) => x.id !== S.spaghetti.variant).map((x) => `<button type="button" class="var" data-act="variant" data-v="${x.id}"><span>${esc(x.label).replace('Spaghetti ', 'Spaghetti<br>')}</span><b>${eur(x.price)}</b></button>`).join('')}</div>
      <button type="button" class="cta" data-act="addspag">In den Warenkorb${I.arrow}</button></section>`;
  }
  function cart() {
    const t = totals();
    const row = (l) => { const isCup = l.kind === 'cup';
      const title = isCup ? `${l.container === 'waffel' ? 'Waffel' : 'Becher'} · ${l.scoops} ${l.scoops === 1 ? 'Kugel' : 'Kugeln'}` : CAT.spaghetti.variants.find((v) => v.id === l.variant).label;
      const sub = isCup ? l.slots.map((f) => F(f).name).join(', ') : '';
      return `<div class="line" data-line="${l.id}"><span class="li">${img(isCup ? 'cup' : 'spaghetti-pistazien')}</span><span class="lt"><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}<em>${eur(lineUnit(l) * l.qty)}</em></span>
        <span class="lq"><button type="button" data-act="lqty" data-id="${l.id}" data-d="-1" aria-label="Weniger">${I.minus}</button><span data-qty>${l.qty}</span><button type="button" data-act="lqty" data-id="${l.id}" data-d="1" aria-label="Mehr">${I.plus}</button></span>
        ${isCup && l.scoops < CAT.maxScoops ? `<button type="button" class="upsell" data-act="morescoop" data-id="${l.id}">${I.plus}<span>Noch eine Kugel</span><b>+${eur(CAT.scoopPrice)}</b></button>` : ''}</div>`; };
    return `<section class="scr cart" data-screen="cart">${top('/')}<h2>Dein Warenkorb</h2>
      <div class="lines">${S.cart.length ? S.cart.map(row).join('') : '<p class="empty">Dein Warenkorb ist leer.</p>'}</div>
      <button type="button" class="ghost" data-act="go" data-to="/builder">${I.plus}Weiteres Eis zusammenstellen</button>
      <div class="total"><span>Gesamt</span><b>${eur(t.amount)}</b></div>
      <button type="button" class="cta" aria-disabled="true" title="Checkout ist im Konzept noch nicht gestaltet">Zur Kasse${I.arrow}</button>
      <p class="note">Checkout ist im Konzept noch nicht gestaltet.</p></section>`;
  }
  const SCREENS = { '/': home, '/builder': builder, '/spaghetti': spaghetti, '/cart': cart };

  /* ---------- render ---------- */
  let current = null;
  function render(animate = false) {
    const tmp = document.createElement('div'); tmp.innerHTML = SCREENS[S.route]().trim(); const next = tmp.firstElementChild;
    const prev = current; app.appendChild(next); current = next;
    if (prev) {
      if (animate && !reduced()) { next.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'cubic-bezier(.2,.7,.2,1)' }); prev.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }).onfinish = () => prev.remove(); }
      else prev.remove();
    }
  }
  const go = (r) => { S.route = r; render(true); };
  const pop = (sel) => { const el = current.querySelector(sel); if (el && !reduced()) el.animate([{ transform: 'scale(.6)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 260, easing: 'cubic-bezier(.2,.8,.3,1.4)' }); };
  function act(el) {
    const a = el.dataset.act; if (!a || el.getAttribute('aria-disabled') === 'true' || el.disabled) return;
    const b = S.builder;
    switch (a) {
      case 'go': go(el.dataset.to); break;
      case 'container': b.container = el.dataset.c; render(); break;
      case 'scoops': b.scoops = Math.min(CAT.maxScoops, Math.max(CAT.minScoops, b.scoops + Number(el.dataset.d))); b.slots = b.slots.slice(0, b.scoops); render(); pop('[data-qty]'); break;
      case 'flavor':   /* each tap fills the next scoop; when all scoops are chosen, nothing changes (raise the count first) */
        if (b.slots.length < b.scoops) { b.slots.push(el.dataset.f); render(); pop(`.fl[data-f="${el.dataset.f}"] .badge`); }
        else if (!reduced()) current.querySelector('.hint').animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], { duration: 200 });
        break;
      case 'undo': b.slots.pop(); render(); break;
      case 'addcup': if (!builderValid(b)) break; S.cart.push({ id: `l${S.next++}`, kind: 'cup', container: b.container, scoops: b.scoops, slots: b.slots.slice(), qty: 1 }); S.builder = newBuilder(); go('/cart'); break;
      case 'variant': S.spaghetti.variant = el.dataset.v; render(); break;
      case 'addspag': { const same = S.cart.find((l) => l.kind === 'spaghetti' && l.variant === S.spaghetti.variant); if (same) same.qty += 1; else S.cart.push({ id: `l${S.next++}`, kind: 'spaghetti', variant: S.spaghetti.variant, qty: 1 }); go('/cart'); break; }
      case 'lqty': { const l = S.cart.find((x) => x.id === el.dataset.id); const q = l.qty + Number(el.dataset.d); if (q < 1) S.cart = S.cart.filter((x) => x !== l); else l.qty = q; render(); break; }
      case 'morescoop': { const l = S.cart.find((x) => x.id === el.dataset.id); if (l.scoops < CAT.maxScoops) { l.scoops += 1; l.slots.push(l.slots[l.slots.length - 1]); } render(); pop(`[data-line="${l.id}"] em`); break; }
      default: break;
    }
  }
  app.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el && app.contains(el)) act(el); });

  /* ---------- deterministic demo states (showroom / QA only) ---------- */
  const FIX = {
    'eis-01-home': () => {},
    'eis-02-builder': () => { S.route = '/builder'; S.builder.slots = ['pistazien']; },
    'eis-03-spaghetti': () => { S.route = '/spaghetti'; },
    'eis-04-cart': () => { S.cart.push({ id: 'l1', kind: 'cup', container: 'becher', scoops: 2, slots: ['pistazien', 'sanddorn-orange'], qty: 1 }, { id: 'l2', kind: 'spaghetti', variant: 'pistazien', qty: 1 }); S.next = 3; S.route = '/cart'; },
  };
  window.__eis = { fixtures: Object.keys(FIX), fixture: (n) => { reset(); FIX[n](); render(); return n; }, reset: () => { reset(); render(); },
    state: () => ({ route: S.route, builder: JSON.parse(JSON.stringify(S.builder)), builderPrice: builderPrice(S.builder), builderValid: builderValid(S.builder), cart: JSON.parse(JSON.stringify(S.cart)), totals: totals() }) };
  reset(); render();
})();
</script>
</body>
</html>
