<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAVN · Am Tisch bestellen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#0D0D0C; --ink2:#171716; --ink3:#232321; --line-d:rgba(255,255,255,.11);
  --bone:#F2EEE7; --paper:#F6F3ED; --tile:#ECE7DE; --line-l:#E2DCD1;
  --gold:#D8B37B; --gold-deep:#B38B4E; --mute-d:#9B968D; --mute-l:#7C776E;
  --desk:#E6E3DE; --desk-2:#D6D2CB;
  --font:"Jost","Futura","Century Gothic","Avenir Next",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --desk:#1B1B1A; --desk-2:#111110; } }
:root[data-theme="dark"]{ --desk:#1B1B1A; --desk-2:#111110; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;font-family:var(--font);font-weight:400;background:radial-gradient(120% 90% at 50% 20%,var(--desk),var(--desk-2));color:var(--bone);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:14px}

#app{position:relative;max-width:440px;margin:0 auto;min-height:100%;overflow:hidden;background:var(--ink)}
@media (min-width:560px){
  body{padding:28px 0}
  #app{min-height:calc(100% - 0px);height:880px;max-height:calc(100vh - 56px);border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 10px #0b0b0b,0 0 0 11px #3a3a3a;overflow:hidden}
  .screen{height:100%}
}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:22px 24px 120px}
.dark{background:var(--ink);color:var(--bone)}
.light{background:var(--paper);color:var(--ink)}
.enter{animation:enter .38s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.enter.back{animation-name:enterBack}
@keyframes enterBack{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}

/* chrome */
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:10px}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.dark .icon-btn.solid{background:var(--ink3)}
.light .icon-btn.solid{background:var(--tile)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.table-pill{height:40px;padding:0 18px;border-radius:40px;display:inline-flex;align-items:center;gap:10px;font-size:15px;letter-spacing:.01em}
.dark .table-pill{border:1px solid rgba(255,255,255,.28)}
.light .table-pill{border:1px solid rgba(0,0,0,.35)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(216,179,123,.18)}

.logo{display:inline-flex;flex-direction:column;gap:8px}
.logo .word{font-weight:300;font-size:40px;letter-spacing:.42em;line-height:1;margin-right:-.42em}
.logo .word .a{color:var(--gold)}
.logo .sub{font-size:10.5px;letter-spacing:.32em;font-weight:400}
.logo.sm .word{font-size:22px;letter-spacing:.36em}
.logo.sm .sub{font-size:8px}
.caps{font-size:11px;letter-spacing:.3em;font-weight:400;text-transform:uppercase}
.m-d{color:var(--mute-d)} .m-l{color:var(--mute-l)}

/* welcome */
.welcome{padding-bottom:36px;display:flex;flex-direction:column}
.welcome .hero{position:absolute;right:-40px;top:190px;width:78%;aspect-ratio:258/397;background-size:cover;background-position:center;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%,#000 80%,transparent 100%),linear-gradient(180deg,transparent 0,#000 12%,#000 85%,transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect;
  mask-image:linear-gradient(90deg,transparent 0,#000 30%,#000 80%,transparent 100%),linear-gradient(180deg,transparent 0,#000 12%,#000 85%,transparent 100%)}
.vert{display:flex;flex-direction:column;gap:9px;margin-top:64px;font-size:10.5px;letter-spacing:.34em;line-height:1.2}
.vert span+span.gap{margin-top:12px}
.welcome h1{font-weight:300;font-size:42px;line-height:1.08;margin:auto 0 18px;letter-spacing:.005em;position:relative}
.welcome .claim{font-size:11px;letter-spacing:.32em;line-height:1.9;margin:0 0 34px}
.round-cta{display:flex;align-items:center;gap:20px;font-size:17px}
.round-cta .c{width:78px;height:78px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:var(--ink);transition:transform .2s}
.round-cta:active .c{transform:scale(.95)}
.round-cta svg,.arrow svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

/* choose */
.h-display{font-weight:300;font-size:40px;line-height:1.1;margin:26px 0 14px}
.h-sub{margin:0 0 26px}
.big-card{position:relative;display:block;width:100%;text-align:left;border-radius:30px;overflow:hidden;background:var(--ink2);height:230px;margin-bottom:14px;border:1px solid var(--line-d)}
.big-card .bg{position:absolute;inset:0;background-size:cover;background-position:center 30%}
.big-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(10,10,9,.85) 100%)}
.big-card .t{position:absolute;left:24px;bottom:26px;z-index:1}
.big-card .t b{display:block;font-weight:300;font-size:28px;margin-bottom:8px}
.big-card .arrow{position:absolute;right:18px;bottom:20px;z-index:1;width:66px;height:66px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center}
.foot{display:flex;align-items:center;gap:18px;margin-top:34px}
.foot .line{flex:1;height:1px;background:currentColor;opacity:.25}

/* categories */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{position:relative;border-radius:24px;background:var(--tile);padding:10px 12px 12px;text-align:left;min-height:180px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.cat.darktile{background:var(--ink);color:var(--bone)}
.cat .img{position:absolute;left:0;right:0;top:0;height:120px;background-size:cover;background-position:center}
.cat.darktile .img{background-size:cover}
.cat .name{font-size:16px;position:relative}
.cat .num{font-size:11px;letter-spacing:.08em;opacity:.6;position:relative;margin-top:3px}
.cat .go{position:absolute;right:10px;bottom:12px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center}
.cat.darktile .go{background:var(--gold);color:var(--ink)}
.cat .go svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}

/* list */
.cat-head{display:flex;align-items:center;gap:14px;margin:14px 0 10px}
.num-badge{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:13px}
.cat-head h2{font-weight:300;font-size:36px;margin:0}
.feature{position:relative;margin:18px -24px 0;height:280px;background-size:cover;background-position:center}
.feature::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,13,12,.1) 0,rgba(13,13,12,0) 50%,var(--ink) 100%)}
.feat-body{position:relative;margin-top:-58px;z-index:1}
.feat-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.feat-row h3{font-weight:400;font-size:28px;margin:0 0 4px}
.price{font-size:18px;font-variant-numeric:tabular-nums}
.desc{font-size:14.5px;line-height:1.55;margin:12px 0 10px;max-width:34ch}
.side-actions{display:flex;flex-direction:column;align-items:center;gap:12px}
.heart svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.4}
.heart.on svg{fill:var(--gold);stroke:var(--gold)}
.add{width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;position:relative}
.add svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.6;fill:none}
.add .q{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--bone);color:var(--ink);font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:500}
.linkish{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;opacity:.85}
.rows{margin-top:18px;border-top:1px solid var(--line-d)}
.row{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line-d);width:100%;text-align:left}
.row .th{width:104px;height:72px;border-radius:14px;background-size:cover;background-position:center;flex:none;background-color:var(--ink3)}
.row .info{flex:1;min-width:0}
.row .info b{display:block;font-weight:400;font-size:17px;margin-bottom:3px}
.row .info small{display:block;font-size:12.5px;line-height:1.4;margin-top:4px;color:var(--mute-d);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .side-actions{gap:8px}
.row .add{width:36px;height:36px}

/* detail */
.detail .plate{margin:-6px -24px 0;height:330px;background-size:cover;background-position:center;border-radius:0 0 36px 36px;position:relative}
.detail .top{position:absolute;left:24px;right:24px;top:22px;z-index:2}
.detail .top .icon-btn{background:rgba(246,243,237,.9);backdrop-filter:blur(8px)}
.eyebrow{color:var(--gold-deep);margin:30px 0 10px}
.detail h2{font-weight:400;font-size:38px;margin:0 0 10px;line-height:1.1}
.detail .desc{color:var(--mute-l);font-size:16px;margin:0 0 16px}
.detail .price{font-size:24px}
.stepper{display:inline-flex;align-items:center;height:56px;border-radius:56px;border:1px solid var(--line-l);background:#fff;margin:28px auto 0}
.stepper button{width:56px;height:56px;display:grid;place-items:center;font-size:22px}
.stepper span{min-width:28px;text-align:center;font-size:19px;font-variant-numeric:tabular-nums}
.center{text-align:center}
.pill-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:58px;border-radius:58px;font-size:17px;letter-spacing:.01em;transition:transform .15s}
.pill-btn:active{transform:scale(.985)}
.pill-btn.black{background:var(--ink);color:var(--bone)}
.pill-btn.gold{background:var(--gold);color:var(--ink)}
.pill-btn.outline{border:1px solid currentColor}
.pill-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
.note-field{margin-top:22px}
.note-field textarea{width:100%;min-height:72px;border-radius:18px;border:1px solid var(--line-l);background:#fff;padding:12px 16px;font:inherit;font-size:15px;resize:vertical;color:var(--ink)}
.feats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:30px;padding-top:22px;border-top:1px solid var(--line-l)}
.feats div{text-align:center;font-size:12.5px;line-height:1.35;color:var(--mute-l);padding:0 6px}
.feats div+div{border-left:1px solid var(--line-l)}
.feats svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.2;margin:0 auto 8px;display:block}

/* table */
.tbl-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 18px}
.tbl-head h2{font-weight:400;font-size:34px;margin:0}
.round-line{display:flex;align-items:center;justify-content:space-between;font-size:15.5px;padding-bottom:16px;border-bottom:1px solid var(--line-d)}
.round-line span{display:inline-flex;align-items:center;gap:12px}
.o-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-d)}
.av{width:44px;height:44px;border-radius:50%;background:var(--ink3);display:grid;place-items:center;font-size:17px;flex:none}
.o-row .who{flex:1;min-width:0}
.o-row .who b{display:block;font-weight:500;font-size:14.5px}
.o-row .who span{font-size:13.5px;color:var(--mute-d)}
.o-row .who em{display:block;font-style:normal;font-size:12px;color:var(--gold);margin-top:2px}
.qty{display:flex;align-items:center;gap:6px;font-size:14px;font-variant-numeric:tabular-nums}
.qty button{width:30px;height:30px;border-radius:50%;background:var(--ink3);display:grid;place-items:center;font-size:16px}
.o-row .amt{width:74px;text-align:right;font-size:14.5px;font-variant-numeric:tabular-nums}
.add-more{display:flex;align-items:center;gap:16px;width:100%;height:52px;border-radius:52px;border:1px solid var(--line-d);padding:0 8px;margin:22px 0 26px;font-size:14px}
.add-more i{width:36px;height:36px;border-radius:50%;background:var(--ink3);display:grid;place-items:center;font-style:normal;font-size:20px}
.sum{display:flex;justify-content:space-between;font-size:16px;margin-bottom:18px;font-variant-numeric:tabular-nums}
.sum b{font-weight:400;font-size:20px}
.terrace{margin:34px -24px -120px;height:260px;background-size:cover;background-position:center;position:relative}
.terrace::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--ink) 0,rgba(13,13,12,0) 45%)}
.terrace .caps{position:absolute;left:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));font-size:10px;line-height:1.9;color:rgba(242,238,231,.8)}
.empty{padding:34px 0 10px;color:var(--mute-d);font-size:15px;line-height:1.6}
.past{margin-top:6px}
.past details{border-bottom:1px solid var(--line-d);padding:12px 0;font-size:14px}
.past summary{display:flex;justify-content:space-between;cursor:pointer;list-style:none}
.past summary::-webkit-details-marker{display:none}
.past ul{margin:10px 0 0;padding:0;list-style:none;color:var(--mute-d);font-size:13px;line-height:1.8}

/* done */
.check{width:118px;height:118px;margin:36px auto 22px;display:block}
.check circle{stroke:var(--gold-deep);stroke-width:1.5;fill:none;stroke-dasharray:360;stroke-dashoffset:360;animation:draw .9s .1s ease-out forwards}
.check path{stroke:var(--gold-deep);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .8s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h2{font-weight:400;font-size:32px;margin:0 0 12px;text-align:center}
.done p.c{text-align:center;color:var(--mute-l);font-size:15.5px;line-height:1.55;margin:0 auto;max-width:30ch}
.gold-rule{width:44px;height:1px;background:var(--gold);margin:28px auto}
.done h3{font-weight:400;font-size:22px;margin:0 0 4px}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 26px}
.rec{background:#fff;border-radius:18px;overflow:hidden;text-align:left;box-shadow:0 1px 0 var(--line-l)}
.rec .ri{height:118px;background-size:cover;background-position:center}
.rec .rb{padding:8px 10px 10px;font-size:13.5px;line-height:1.25}
.rec .rp{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px}
.rec .add{width:28px;height:28px}
.rec .add svg{width:14px;height:14px}
.stack{display:grid;gap:12px}
.foot.l{color:var(--ink)}

/* floating bar */
.float{position:absolute;left:20px;right:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:14px;height:62px;border-radius:62px;background:var(--gold);color:var(--ink);padding:0 22px 0 8px;box-shadow:0 14px 34px rgba(0,0,0,.35);animation:rise .3s ease-out}
.float .n{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-weight:500}
.float .l{flex:1;text-align:left;font-size:16px}
.float .p{font-size:16px;font-variant-numeric:tabular-nums;font-weight:500}
@keyframes rise{from{transform:translateY(20px);opacity:0}}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;background:var(--paper);color:var(--ink);border-radius:30px 30px 0 0;padding:14px 24px calc(26px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.7,.2,1);max-height:88%;overflow:auto}
.sheet.dk{background:var(--ink2);color:var(--bone)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:4px;border-radius:4px;background:currentColor;opacity:.2;margin:0 auto 18px}
.sheet h3{font-weight:400;font-size:24px;margin:0 0 6px}
.sheet p{margin:0 0 18px;color:var(--mute-l);font-size:14.5px;line-height:1.5}
.sheet.dk p{color:var(--mute-d)}
.field{width:100%;height:54px;border-radius:54px;border:1px solid var(--line-l);background:#fff;padding:0 20px;font:inherit;font-size:16px;color:var(--ink);margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{height:40px;padding:0 18px;border-radius:40px;background:var(--tile);font-size:15px}
.chip.on{background:var(--ink);color:var(--bone)}
.menu-list button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:18px 0;border-bottom:1px solid var(--line-d);font-size:20px;font-weight:300}
.split{margin:6px 0 18px}
.split div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-l);font-size:15px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--tile);border-radius:40px;padding:4px;margin-bottom:16px}
.seg button{height:40px;border-radius:40px;font-size:14.5px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.err{color:#A5402D;font-size:13.5px;margin:-6px 0 12px 10px}

/* toast */
.toast{position:absolute;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--bone);color:var(--ink);padding:12px 20px;border-radius:40px;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition:none!important}
}
</style>
</head>
<body>

/* ---------- render ---------- */
const app = document.getElementById("app");
function render(dir){
  const cur = stack[stack.length-1];
  app.innerHTML = V[cur.v](cur);
  const sc = app.querySelector(".screen");
  if(dir){ sc.classList.add("enter"); if(dir==="back") sc.classList.add("back"); }
  if(cur.scroll) sc.scrollTop = cur.scroll;
  sc.addEventListener("scroll",()=>{ cur.scroll = sc.scrollTop; },{passive:true});
  if(["choose","cats","list"].includes(cur.v) && S.cart.length){
    app.insertAdjacentHTML("beforeend",`<button class="float" data-a="go" data-v="table"><span class="n">${cartCount()}</span><span class="l">Tisch ${esc(TABLE)} · Runde ${roundNo()}</span><span class="p">${eur(cartTotal())}</span></button>`);
  }
  const note = app.querySelector("#note"); if(note) note.addEventListener("input",e=>ui.note=e.target.value);
}
function go(v, extra){ ui.qty=1; ui.note=""; ui.editRow=null; stack.push({v,...extra}); history.pushState({d:stack.length},""); render("fwd"); }
function back(){ if(stack.length>1){ history.back(); } }
window.addEventListener("popstate",()=>{ if(stack.length>1){ stack.pop(); ui.editRow=null; render("back"); } });
function refresh(){ render(); }

let toastT;
function toast(msg){ app.querySelector(".toast")?.remove(); app.insertAdjacentHTML("beforeend",`<div class="toast" role="status">${esc(msg)}</div>`); clearTimeout(toastT); toastT=setTimeout(()=>app.querySelector(".toast")?.remove(),2600); }

function sheet(html, dark){ closeSheet(); app.insertAdjacentHTML("beforeend",`<div class="scrim" data-a="scrim"><div class="sheet${dark?" dk":""}" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`); const f=app.querySelector(".sheet input,.sheet button"); f&&f.focus(); }
function closeSheet(){ app.querySelector(".scrim")?.remove(); }

function addToCart(itemId, qty, note){
  const doAdd = () => {
    const ex = S.cart.find(c=>c.itemId===itemId && c.guest===S.guest && (c.note||"")===(note||""));
    if(ex) ex.qty += qty; else S.cart.push({itemId, qty, guest:S.guest, note:note||""});
    save(); toast(`${qty} × ${byId[itemId].name} für ${S.guest}`);
  };
  if(!S.guest){ ui.pendingAdd = {itemId, qty, note, after:doAdd}; askName(); return false; }
  doAdd(); return true;
}
function askName(){
  sheet(`<h3>Wer bestellt?</h3><p>Damit alle am Tisch sehen, was wem gehört. Jeder kann vom eigenen Handy den QR-Code scannen.</p>
    ${S.guests.length?`<div class="chips">${S.guests.map(g=>`<button class="chip${g===S.guest?" on":""}" data-a="pickGuest" data-g="${esc(g)}">${esc(g)}</button>`).join("")}</div>`:""}
    <input class="field" id="gname" placeholder="Dein Vorname" maxlength="18" autocomplete="given-name">
    <div id="gerr"></div>
    <button class="pill-btn black" data-a="saveGuest">Weiter</button>`);
  const inp = app.querySelector("#gname"); inp && inp.addEventListener("keydown",e=>{ if(e.key==="Enter") app.querySelector('[data-a="saveGuest"]').click(); });
}
function setGuest(g){
  S.guest = g; if(!S.guests.includes(g)) S.guests.push(g); save(); closeSheet();
  const p = ui.pendingAdd; ui.pendingAdd=null;
  if(p){ p.after(); if(p.fromDetail){ back(); return; } }
  refresh();
}

/* ---------- events ---------- */
app.addEventListener("click", e=>{
  const t = e.target.closest("[data-a]"); if(!t) return;
  const a = t.dataset.a;
  if(a==="scrim"){ if(e.target===t) closeSheet(); return; }
  e.stopPropagation();
  switch(a){
    case "go": go(t.dataset.v, {cat:t.dataset.cat, id:t.dataset.id}); break;
    case "back": back(); break;
    case "fav": { const id=t.dataset.id; S.favs = S.favs.includes(id)? S.favs.filter(x=>x!==id) : [...S.favs,id]; save(); t.classList.toggle("on"); t.setAttribute("aria-pressed", S.favs.includes(id)); break; }
    case "quickadd": if(addToCart(t.dataset.id,1,"")) refresh(); break;
    case "step": { ui.qty = Math.max(1, Math.min(20, ui.qty + (+t.dataset.d))); app.querySelector("#qty").textContent = ui.qty;
      const it = byId[stack[stack.length-1].id]; app.querySelector("#dtot").textContent = eur(it.price*ui.qty); break; }
    case "addDetail": { const id=t.dataset.id; const q=ui.qty, n=ui.note.trim();
      if(!S.guest){ ui.pendingAdd={itemId:id,qty:q,note:n,fromDetail:true,after:()=>{ const ex=S.cart.find(c=>c.itemId===id&&c.guest===S.guest&&(c.note||"")===n); if(ex) ex.qty+=q; else S.cart.push({itemId:id,qty:q,guest:S.guest,note:n}); save(); toast(`${q} × ${byId[id].name} für ${S.guest}`);} }; askName(); }
      else { addToCart(id,q,n); back(); }
      break; }
    case "pickGuest": setGuest(t.dataset.g); break;
    case "saveGuest": { const v = (app.querySelector("#gname").value||"").trim();
      if(!v){ app.querySelector("#gerr").innerHTML = `<p class="err">Gib einen Namen ein, damit der Service weiß, wem was gehört.</p>`; app.querySelector("#gname").focus(); return; }
      setGuest(v.charAt(0).toUpperCase()+v.slice(1)); break; }
    case "edit": ui.editRow = +t.dataset.i; refresh(); break;
    case "rowq": { const i=+t.dataset.i; S.cart[i].qty += +t.dataset.d; if(S.cart[i].qty<=0){ const n=byId[S.cart[i].itemId].name; S.cart.splice(i,1); ui.editRow=null; toast(`${n} entfernt`);} save(); refresh(); break; }
    case "order": {
      const now = new Date(); const time = now.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
      S.rounds.push({n:roundNo(), items:S.cart.map(c=>({...c})), total:cartTotal(), time}); S.cart=[]; save();
      stack = [{v:"welcome"},{v:"done"}]; history.pushState({d:2},""); render("fwd"); break; }
    case "service": toast(`Der Service kommt gleich an Tisch ${TABLE}.`); break;
    case "allergy": sheet(`<h3>Allergene &amp; Zusatzstoffe</h3><p>Sprich unser Team gerne an – wir informieren dich zu jedem Gericht persönlich. Hinweise wie „ohne Nüsse“ kannst du beim Gericht direkt an die Küche schicken.</p><button class="pill-btn black" data-a="service">${ic.bell} Service rufen</button>`); break;
    case "pay": openPay(); break;
    case "payMode": ui.pay = t.dataset.m; openPay(); break;
    case "requestBill": closeSheet(); toast(ui.pay==="split" ? `Getrennte Rechnungen kommen an Tisch ${TABLE}.` : `Die Rechnung kommt an Tisch ${TABLE}.`); break;
    case "menu": sheet(`<div class="menu-list">
        <button data-a="nav" data-v="cats">Speisekarte ${ic.chev.replace("<svg","<svg width='18' height='18' style='stroke:currentColor;fill:none;stroke-width:1.5'")}</button>
        <button data-a="nav" data-v="list" data-cat="drinks">Getränke ${ic.chev.replace("<svg","<svg width='18' height='18' style='stroke:currentColor;fill:none;stroke-width:1.5'")}</button>
        <button data-a="nav" data-v="table">Unser Tisch · ${cartCount()} ${ic.chev.replace("<svg","<svg width='18' height='18' style='stroke:currentColor;fill:none;stroke-width:1.5'")}</button>
        <button data-a="nav" data-v="name">${S.guest?`Name: ${esc(S.guest)}`:"Name festlegen"} ${ic.chev.replace("<svg","<svg width='18' height='18' style='stroke:currentColor;fill:none;stroke-width:1.5'")}</button>
      </div><button class="pill-btn gold" style="margin-top:22px" data-a="service">${ic.bell} Service rufen</button>`, true); break;
    case "nav": closeSheet(); if(t.dataset.v==="name"){ askName(); } else go(t.dataset.v,{cat:t.dataset.cat}); break;
  }
});
app.addEventListener("keydown", e=>{ const t=e.target.closest('[role="button"][data-a]'); if(t && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); t.click(); } if(e.key==="Escape") closeSheet(); });

function openPay(){
  const rounds = S.rounds; const total = rounds.reduce((a,r)=>a+r.total,0);
  if(!rounds.length){ toast("Bestellt zuerst eine Runde."); return; }
  const per = {}; rounds.forEach(r=>r.items.forEach(x=>{ per[x.guest]=(per[x.guest]||0)+x.qty*byId[x.itemId].price; }));
  sheet(`<h3>Bezahlen</h3><p>${rounds.length} ${rounds.length===1?"Runde":"Runden"} an Tisch ${esc(TABLE)}</p>
    <div class="seg"><button class="${ui.pay==="together"?"on":""}" data-a="payMode" data-m="together">Zusammen</button><button class="${ui.pay==="split"?"on":""}" data-a="payMode" data-m="split">Getrennt</button></div>
    <div class="split">${ui.pay==="split" ? Object.entries(per).map(([g,v])=>`<div><span>${esc(g)}</span><span>${eur(v)}</span></div>`).join("") : ""}
      <div style="border:0;font-size:18px"><span>Gesamt</span><span>${eur(total)}</span></div></div>
    <button class="pill-btn black" data-a="requestBill">${ic.card} Rechnung an den Tisch</button>`);
}

history.replaceState({d:1},"");
render();
</script>
</body>
</html>
