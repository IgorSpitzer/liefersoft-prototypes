<style>/* Nicezeit preview — scoped brand tokens (vorläufig: no confirmed Nicezeit CD). Mobile first; desktop ≥ 1024 px adds a side cart. */
:root { --bg: #faf7f2; --surface: #ffffff; --ink: #1f2a2e; --muted: #5d6b70; --line: #e6dfd4; --brand: #1f6f78; --brand-ink: #ffffff;
  --accent: #e6866a; --ok: #2f7a4d; --warn: #9a5b00; --demo: #6b3fa0; --r: 16px;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; --disp: 'Cormorant Garamond', Georgia, serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--brand); } button, input { font: inherit; color: inherit; }
button { cursor: pointer; } [aria-disabled='true'] { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.skip { position: absolute; left: -999px; } .skip:focus { left: 8px; top: 8px; z-index: 99; background: #fff; padding: 8px 12px; }
#app { min-height: 100vh; }
main { max-width: 1120px; margin: 0 auto; padding: 16px 16px 120px; }
.lab { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 8px 12px; background: #20272a; color: #e9eef0; font-size: 13px; }
.lab a, .lab button { color: #e9eef0; background: transparent; border: 1px solid #4d5a5f; border-radius: 999px; padding: 6px 10px; min-height: 32px; text-decoration: none; }
.lab a.on, .lab [aria-pressed='true'] { background: #e9eef0; color: #20272a; } .labtag { font-weight: 700; margin-right: 6px; }
.hd { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: rgba(250,247,242,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.wm { font: italic 700 26px/1 var(--disp); color: var(--ink); text-decoration: none; letter-spacing: -.3px; }
.hd nav { display: flex; gap: 4px; margin-left: auto; } .hd nav a { padding: 10px 12px; border-radius: 999px; text-decoration: none; color: var(--ink); font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; }
.hd nav a[aria-current='page'] { background: var(--line); }
.cartbtn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--brand); color: var(--brand-ink); font-weight: 700; }
.cartbtn b { display: grid; place-items: center; min-width: 24px; height: 24px; border-radius: 12px; background: #fff; color: var(--brand); font-size: 13px; }
@media (max-width: 420px) { .hd nav a { padding: 10px 8px; } .cartbtn { font-size: 0; gap: 0; padding: 0 10px; } .cartbtn b { font-size: 13px; } }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 700; text-decoration: none; border: 2px solid var(--brand); }
.btn.primary { background: var(--brand); color: var(--brand-ink); } .btn.ghost { background: transparent; color: var(--brand); }
.hero { display: grid; gap: 12px; padding: 28px 20px; border-radius: 24px; background: linear-gradient(160deg, #e7f1f0 0%, #fbeee7 100%); }
.kicker { margin: 0; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: var(--brand); }
.hero h1 { margin: 6px 0 0; font: 700 clamp(34px, 7vw, 56px)/1.05 var(--disp); }
.lead { margin: 10px 0 0; color: var(--muted); font-size: 17px; } .ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.heroart { display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
@media (min-width: 760px) { .hero { grid-template-columns: 1.4fr 1fr; padding: 48px; align-items: center; } }
.preview-note, .draft, .pending { margin: 14px 0; padding: 10px 14px; border-radius: 12px; background: #fff6e5; color: var(--warn); font-size: 14px; font-weight: 600; }
.demobadge { display: inline-block; margin: 10px 0; padding: 8px 12px; border-radius: 10px; background: #efe6fa; color: var(--demo); font-weight: 700; font-size: 14px; }
.block { margin-top: 28px; } .block h2, .explorer h2, .explorer h1, .builder h1, .boundary h1, .review h1, .shopintro h1 { font: 700 30px/1.1 var(--disp); margin: 0 0 4px; }
.sub, .muted { color: var(--muted); margin: 4px 0 12px; }
.minis { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.minis button { width: 100%; min-height: 64px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-align: left; font-weight: 600; }

    return `<label class="opt ${type} ${n ? 'sel' : ''}" data-opt="${o.id}"><input type="${g.selectionMode === 'single' ? 'radio' : 'checkbox'}" name="${g.id}" data-act="toggle" data-g="${g.id}" data-o="${o.id}" ${n ? 'checked' : ''} ${av ? '' : 'disabled'}><span class="on">${esc(o.label)}${status}${price}</span></label>`;
  }
  const groupHead = (g) => { const n = session.countOf(g); const lim = g.max != null ? (g.min === g.max ? `${n} von ${g.max}` : `${n}, max. ${g.max}`) : `${n} gewählt`; return `<legend>${esc(g.label)} <small>${lim}</small></legend>`; };
  const groupVisual = (g) => `<fieldset class="grp vis">${groupHead(g)}<div class="opts cards">${g.options.map((o) => optRow(g, o, 'card')).join('')}</div></fieldset>`;
  const groupList = (g) => `<fieldset class="grp lst">${groupHead(g)}<div class="opts rows">${g.options.map((o) => optRow(g, o, 'row')).join('')}</div></fieldset>`;
  function summaryText(c, p) {
    const v = p.variants.find((x) => x.id === c.variantId);
    const parts = c.options.map((o) => { const g = p.groups.find((x) => x.id === o.groupId); const opt = g && g.options.find((x) => x.id === o.optionId); return `${o.quantity}× ${opt ? opt.label : o.optionId}`; });
    return `${v ? v.label : '–'}${parts.length ? ' · ' + parts.join(', ') : ' · noch keine Sorte'}`;
  }
  function priceText(qr) {
    if (!qr) return '';
    if (qr.status === 'unconfirmed') return 'Preis noch nicht bestätigt';
    if (qr.status !== 'ok') return 'Preis folgt, sobald die Auswahl vollständig ist';
    return `Demo-Schätzung: ${eur(qr.totalCents)}`;
  }
  function paintPrice() { const el = app.querySelector('[data-price]'); if (el) el.textContent = priceText(S.quote); }

  /* ---- cart (shared, single) ---- */
  const lineQuote = (l) => RT.demoQuoteProvider.quote(l.product, l.selection);
  function cartPanel() {
    const lines = S.cart; const qs = lines.map(lineQuote);
    const allDemo = qs.length && qs.every((x) => x.status === 'ok');
    return `<aside class="cart ${S.cartOpen ? 'open' : ''}" aria-label="Warenkorb" ${S.cartOpen ? '' : 'aria-hidden="true" inert'}>
      <div class="ch"><h2>Warenkorb</h2><button type="button" class="x" data-act="cart" aria-label="Warenkorb schließen">×</button></div>
      ${lines.length ? `<ul class="lines">${lines.map((l, i) => `<li data-line="${l.id}"><b>${esc(l.product.label)}</b><span>${esc(summaryText(l.selection, l.product))}</span>
          <span class="lp">${esc(priceText(qs[i]))}</span>
          <span class="la"><span class="step"><button type="button" data-act="lqty" data-id="${l.id}" data-d="-1" aria-label="Weniger">−</button><output>${l.selection.quantity}</output><button type="button" data-act="lqty" data-id="${l.id}" data-d="1" aria-label="Mehr">+</button></span>
          <button type="button" class="link" data-act="edit" data-id="${l.id}">Bearbeiten</button><button type="button" class="link" data-act="remove" data-id="${l.id}">Entfernen</button></span></li>`).join('')}</ul>
        <p class="ctotal">${allDemo ? `Summe (Demo-Schätzung): <b>${eur(qs.reduce((n, x) => n + x.totalCents, 0))}</b>` : 'Summe: Preis noch nicht bestätigt'}</p>
        ${demoBadge()}
        <a class="btn primary" href="#/demo-kasse" data-act="cart">Zur Kasse (Demo)</a>` : '<p class="empty">Dein Warenkorb ist leer.</p><a class="btn ghost" href="#/eis" data-act="cart">Mein Eis zusammenstellen</a>'}</aside>`;
  }
  function launcher() {
    const n = cartCount();
    if (!n || S.cartOpen || route() === '/demo-kasse' || route() === '/eis') return '';
    return `<button type="button" class="launcher" data-act="cart">Warenkorb · ${n} Artikel</button>`;
  }
  function boundary() {
    const qs = S.cart.map(lineQuote);
    return `<section class="boundary" aria-labelledby="bdh"><h1 id="bdh">Demo — es wird keine echte Bestellung ausgelöst.</h1>
      <p>Dies ist eine interne Vorschau. Es werden keine Daten abgefragt, keine Zahlung ausgeführt und keine Bestellung an Nicezeit übermittelt.</p>
      ${S.cart.length ? `<ul class="lines static">${S.cart.map((l, i) => `<li><b>${esc(l.product.label)}</b><span>${esc(summaryText(l.selection, l.product))}</span><span class="lp">${l.selection.quantity}× · ${esc(priceText(qs[i]))}</span></li>`).join('')}</ul>` : '<p class="empty">Der Warenkorb ist leer.</p>'}
      ${demoBadge()}
      <p class="flags">Bestellannahme: ${FLAGS.acceptOrders ? 'an' : 'aus'} · Echte Zahlung: ${FLAGS.realPayment ? 'an' : 'aus'}</p>
      <a class="btn ghost" href="#/shop">Zurück zum Shop</a></section>`;
  }
  function review() {
    if (PREVIEW !== 'lab') return '<p class="empty">Nur in der internen Vorschau.</p>';
    const f = R.flavors; const n = (pred) => f.filter(pred).length;
    const gate = (p) => R.gates.filter((g) => g.priority === p);
    return `<section class="review" aria-labelledby="rvh"><h1 id="rvh">Datenprüfung · ${esc(R.meta.merchant)} (Stand ${esc(R.meta.snapshotDate)})</h1>
      <p class="draft">${esc(R.meta.dataStatus)} · seedIds sind keine Liefersoft-Produkt-IDs</p>
      <div class="kpis">${[[f.length, 'Sorten (Recherche)'], [n((x) => x.vegan === 'pdfYes'), 'vegan laut PDF'], [n((x) => x.status === 'winter'), 'Wintersorten (vegan unbekannt)'], [n((x) => x.status === 'pdfOnly'), 'nur PDF 2025'],
        [n((x) => x.retailPriceMinor === null), 'ohne Verkaufspreis'], [n((x) => !x.allergenDeclaration), 'ohne Allergenangabe'], [n((x) => x.availability === 'unknown'), 'Verfügbarkeit unbekannt'], [n((x) => x.image && x.image.type === 'sku'), 'Sortenbilder (Rechte ungeklärt)']]
        .map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>
      <h2>Fehlende Freigaben</h2><ul class="gaps"><li>Optionsregeln (Becher/Waffel, Kugelanzahl, Toppings, Saucen): nicht bestätigt</li><li>Filial-Verfügbarkeit: keine Daten</li><li>Abholung/Lieferung, Zeiten, Zahlungsarten: nicht bestätigt</li><li>Allergen-Codes A/B/G: Legende nicht bestätigt, nicht decodiert</li><li>Bildrechte: ${R.media.length} Referenzen, alle „unconfirmed“</li><li>Preview-Code-Modus: ${esc(R.policy.previewCodeGate)}</li></ul>
      <h2>Preisbeobachtungen (nur interne Prüfung, nicht für Checkout)</h2><div class="tw"><table><thead><tr><th>Bereich</th><th>Artikel</th><th>Filiale</th><th>Wert</th><th>Einheit</th><th>Stand</th><th>Status</th><th>Quelle</th></tr></thead><tbody>
      ${R.priceObservations.map((p) => `<tr><td>${esc(p.section)}</td><td>${esc(p.name)}</td><td>${esc(p.observedBranchLabel)}</td><td>${p.observedPriceMinor == null ? '–' : eur(p.observedPriceMinor)}</td><td>${esc(p.unit)}</td><td>${esc(p.dateOrSourcePeriod)}</td><td>${esc(p.verificationStatus)}</td><td><a href="${esc(p.sourceUrl)}" target="_blank" rel="noopener noreferrer">Quelle</a></td></tr>`).join('')}</tbody></table></div>
      <h2>Offene Entscheidungen</h2>${['P0', 'P1'].map((p) => `<h3>${p}</h3><ul class="gates">${gate(p).map((g) => `<li><b>${esc(g.topic)}</b> · ${esc(g.sourceStatus)}<br><span>${esc(g.question)}</span></li>`).join('')}</ul>`).join('')}
      <h2>Medien</h2><div class="tw"><table><thead><tr><th>Motiv</th><th>Art</th><th>Rechte</th><th>Hinweis</th></tr></thead><tbody>${R.media.map((m) => `<tr><td>${esc(m.subject)}</td><td>${esc(m.kind)}</td><td>${esc(m.usageRights)}</td><td>${esc(m.notes)}</td></tr>`).join('')}</tbody></table></div>
      <h2>Quellen</h2><ul class="gates">${R.sources.map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a> · ${esc(s.dateOrPeriod)}<br><span>${esc(s.reliabilityNote)}</span></li>`).join('')}</ul></section>`;
  }

  /* ---------------- render ---------------- */
  let lastFocus = null;
  function render() {
    const r = route();
    const body = r === '/' ? landing() : r === '/shop' ? shop() : r === '/sorten' ? explorer() : r === '/eis' ? builder() : r === '/demo-kasse' ? boundary() : review();
    const keep = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.act === 'search';
    const caret = keep ? document.activeElement.selectionStart : null;
    app.innerHTML = `${labbar()}${header()}<main id="main" class="r-${r.slice(1) || 'landing'}">${S.demo && r !== '/eis' && r !== '/demo-kasse' ? demoBadge() : ''}${body}</main>${cartPanel()}${launcher()}${S.detail ? detailSheet() : ''}`;
    document.documentElement.dataset.demo = S.demo ? '1' : '0';
    app.classList.toggle('cart-open', S.cartOpen);
    app.querySelectorAll('img.srcimg').forEach((im) => im.addEventListener('error', () => { im.outerHTML = scoopArt(im.dataset.fb, im.width); }, { once: true }));
    if (keep) { const i = app.querySelector('[data-act="search"]'); i.focus(); i.setSelectionRange(caret, caret); }
    if (r === '/eis') requestQuote();
    if (S.detail) { const s = app.querySelector('.sheet .x'); if (s) s.focus(); }
    else if (S.cartOpen) { const c = app.querySelector('.cart .x'); if (c) c.focus(); }
  }
  const restoreFocus = () => { if (lastFocus) { const el = app.querySelector(lastFocus); if (el) el.focus(); lastFocus = null; } };

  /* ---------------- actions ---------------- */
  function cmd(res, focusSel) { S.notice = res.ok ? null : (ISSUE[res.issue.code] || res.issue.code); render(); if (focusSel) { const el = app.querySelector(focusSel); if (el) el.focus(); } }
  app.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const a = el.dataset.act;
    if (el.getAttribute('aria-disabled') === 'true') {
      e.preventDefault();
      if (a === 'commit') { S.notice = !S.demo ? PENDING : 'Bitte die Auswahl vervollständigen.'; render(); }
      if (a === 'variant' || a === 'qty') { const r = a === 'variant' ? session.setVariant(el.dataset.v) : session.setOptionQuantity(el.dataset.g, el.dataset.o, session.quantityOf(el.dataset.g, el.dataset.o) + Number(el.dataset.d)); if (!r.ok) cmd(r); }
      return;
    }
    if (a === 'search' || a === 'toggle') return;
    switch (a) {
      case 'cart': S.cartOpen = !S.cartOpen; if (el.tagName !== 'A') { e.preventDefault(); render(); if (!S.cartOpen) { lastFocus = '.cartbtn'; restoreFocus(); } } break;
      case 'demo': S.demo = !S.demo; S.editLine = null; S.notice = null; resetSession(); render(); break;
      case 'srcimg': S.showSourceImages = !S.showSourceImages; render(); break;
      case 'filter': S.filter = el.dataset.f; render(); app.querySelector(`[data-act="filter"][data-f="${S.filter}"]`).focus(); break;
      case 'detail': lastFocus = `[data-act="detail"][data-id="${el.dataset.id}"]`; S.detail = el.dataset.id; render(); break;
      case 'closedetail': S.detail = null; if (el.tagName !== 'A') { e.preventDefault(); render(); restoreFocus(); } break;
      case 'bview': S.builderView = el.dataset.v; render(); break;
      case 'variant': cmd(session.setVariant(el.dataset.v), `[data-act="variant"][data-v="${el.dataset.v}"]`); break;
      case 'qty': cmd(session.setOptionQuantity(el.dataset.g, el.dataset.o, session.quantityOf(el.dataset.g, el.dataset.o) + Number(el.dataset.d)), `[data-act="qty"][data-o="${el.dataset.o}"][data-d="${el.dataset.d}"]`); break;
      case 'commit': {
        const c = session.commit(); if (!c.ok) { S.notice = 'Bitte die Auswahl vervollständigen.'; render(); break; }
        if (S.editLine) { const l = S.cart.find((x) => x.id === S.editLine); l.selection = c.selection; S.editLine = null; }
        else {
          const same = S.cart.find((x) => x.product === session.product && RT.fingerprint(x.selection) === RT.fingerprint(c.selection));
          if (same) same.selection = { ...same.selection, quantity: same.selection.quantity + c.selection.quantity };
          else S.cart.push({ id: `l${S.nextLine++}`, product: session.product, selection: c.selection });
        }
        S.notice = 'Zum Warenkorb hinzugefügt.'; resetSession(); S.cartOpen = true; render();
        if (!reduced()) { const b = app.querySelector('.cartbtn b'); if (b && b.animate) b.animate([{ transform: 'scale(1.5)' }, { transform: 'none' }], { duration: 260 }); }
        break;
      }
      case 'canceledit': S.editLine = null; resetSession(); S.cartOpen = true; render(); break;
      case 'lqty': { const l = S.cart.find((x) => x.id === el.dataset.id); const n = l.selection.quantity + Number(el.dataset.d); if (n < 1) S.cart = S.cart.filter((x) => x !== l); else l.selection = { ...l.selection, quantity: n }; render(); break; }
      case 'remove': S.cart = S.cart.filter((x) => x.id !== el.dataset.id); render(); { const x = app.querySelector('.cart .x'); if (x) x.focus(); } break;
      case 'edit': { const l = S.cart.find((x) => x.id === el.dataset.id); S.demo = l.product.pricing === 'demo';
        session = RT.createSession(l.product, { selection: l.selection }); S.editLine = l.id; S.cartOpen = false; go('/eis'); break; }
      default: break;
    }
  });
  app.addEventListener('change', (e) => {
    const el = e.target; if (el.dataset.act !== 'toggle') return;
    cmd(session.setOptionQuantity(el.dataset.g, el.dataset.o, el.checked ? 1 : 0), `[data-act="toggle"][data-o="${el.dataset.o}"]`);
  });
  app.addEventListener('input', (e) => { if (e.target.dataset.act === 'search') { S.search = e.target.value; render(); } });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (S.detail) { S.detail = null; render(); restoreFocus(); } else if (S.cartOpen) { S.cartOpen = false; render(); lastFocus = '.cartbtn'; restoreFocus(); }
  });

  /* QA/showroom hook — read-only state + deterministic states; not part of the guest UI */
  window.__nicezeit = {
    state: () => ({ route: route(), demo: S.demo, cart: S.cart.map((l) => ({ product: l.product.id, selection: l.selection, quote: lineQuote(l) })), session: session.canonical(), validation: session.validate(), flags: { ...FLAGS } }),
    fixtures: ['nz-landing', 'nz-explorer', 'nz-builder', 'nz-builder-demo', 'nz-cart-demo', 'nz-boundary', 'nz-review'],
    fixture(n) {
      S.cart = []; S.editLine = null; S.notice = null; S.detail = null; S.cartOpen = false; S.search = ''; S.filter = 'alle';
      S.demo = /demo/.test(n); resetSession();
      if (n === 'nz-builder-demo' || n === 'nz-cart-demo') { session.setVariant('demo-becher-3'); session.setOptionQuantity('demo-flavors', 'demo-vanille', 2); session.setOptionQuantity('demo-flavors', 'demo-schokolade', 1); }
      if (n === 'nz-cart-demo') { S.keepCart = true; const c = session.commit(); S.cart.push({ id: `l${S.nextLine++}`, product: session.product, selection: c.selection }); resetSession(); S.cartOpen = true; }
      const map = { 'nz-landing': '/', 'nz-explorer': '/sorten', 'nz-builder': '/eis', 'nz-builder-demo': '/eis', 'nz-cart-demo': '/shop', 'nz-boundary': '/demo-kasse', 'nz-review': '/pruefung' };
      if (location.hash === `#${map[n]}`) render(); else { location.hash = map[n]; }
      return n;
    },
  };
  render();
})();
</script>
</body>
</html>
