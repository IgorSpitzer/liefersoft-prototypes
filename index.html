<!doctype html>
<html lang="en">
<head>

<style>/* LS Experience Showroom shell — neutral, responsive. Never styles the experiences (they run in iframes). */
:root { --bg: #0d1013; --panel: #161b20; --line: #2a3038; --text: #eef1f4; --muted: #96a0ab; --accent: #4fd1a5; --warn: #f2c14e;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
a { color: inherit; }
body.launching { overflow: hidden; background: #000; }
.shell { max-width: 1240px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 40px) 60px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.logo { text-decoration: none; font-size: 22px; font-weight: 600; } .logo b { background: var(--accent); color: #062018; padding: 2px 8px; border-radius: 6px; margin-right: 6px; }
.count { color: var(--muted); font-size: 14px; }
.modes { display: inline-flex; margin-top: 22px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.modes a { padding: 10px 18px; text-decoration: none; font-weight: 600; color: var(--muted); }
.modes a[aria-current='true'] { background: var(--panel); color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chips a { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); text-decoration: none; font-size: 14px; }
.chips a i { font-style: normal; color: var(--muted); margin-left: 4px; }
.chips a.zero { color: var(--muted); }
.chips a[aria-current='true'] { border-color: var(--accent); color: var(--accent); }
.group { margin-top: 34px; } .group header { display: flex; align-items: baseline; gap: 12px; }
.group h2 { margin: 0; font-size: 24px; } .group h2 a { text-decoration: none; } .group header p { margin: 0; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; margin-top: 16px; }
.xcard { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--panel); }
.xprev { position: relative; height: 300px; background: #050607; display: grid; place-items: center; overflow: hidden; }
.xprev img { height: 92%; width: auto; max-width: 92%; object-fit: contain; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
.dev-label { position: absolute; left: 10px; bottom: 10px; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.7); color: var(--muted); }
.xbody { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.xsurf { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.xbody h3 { margin: 0; font-size: 18px; } .xmeta, .xbuild { margin: 0; color: var(--muted); font-size: 13px; }
.xbuild { font-family: ui-monospace, monospace; font-size: 12px; }
.xstatus { margin: 4px 0 0; font-size: 13px; font-weight: 600; } .xstatus.frozen { color: var(--warn); } .xstatus.live { color: var(--accent); }
.xacts { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
  background: transparent; color: var(--text); font: 600 14px/1 inherit; text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #062018; }
.xempty { display: flex; flex-direction: column; justify-content: center; gap: 4px; min-height: 120px; padding: 16px; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); }
.xempty b { color: var(--text); font-weight: 600; }
.crumb { color: var(--muted); margin: 18px 0 0; } .bhead h1 { margin: 6px 0 0; font-size: 34px; } .bhead p { margin: 4px 0 0; color: var(--muted); }
.foot { margin-top: 48px; color: var(--muted); font-size: 13px; } .none { color: var(--muted); margin-top: 30px; }
/* viewer */
.viewer { position: fixed; inset: 0; background: #000; }
.viewer .frame { position: absolute; left: 50%; top: 50%; width: var(--w); height: var(--h); transform-origin: 50% 50%; margin-left: calc(var(--w) / -2); margin-top: calc(var(--h) / -2); }
.viewer .frame.fill { left: 0; top: 0; width: 100%; height: 100%; margin: 0; transform: none; }
.viewer iframe { display: block; width: 100%; height: 100%; border: 0; background: #000; }
.viewer.present .frame.phone:not(.fill) { border-radius: 28px; overflow: hidden; }
.escape { position: fixed; z-index: 5; left: 0; bottom: 0; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; opacity: 0; cursor: default; }
.viewer.dev { display: grid; grid-template-columns: 300px 1fr; }
.ctl { position: relative; z-index: 2; overflow-y: auto; padding: 18px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.ctl h2 { margin: 6px 0 0; font-size: 18px; } .ctl h3 { margin: 10px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.states { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.st { min-height: 36px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text); font: 500 13px/1.2 inherit; cursor: pointer; }
.st[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); } .st:disabled { opacity: .35; cursor: default; }
.all { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.all select { min-height: 36px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; }
.row { display: flex; gap: 8px; } .row .btn { flex: 1; }
.cvlabel, .note { margin: 0; color: var(--muted); font-size: 12px; }
.stagearea { position: relative; overflow: hidden; background: repeating-conic-gradient(#0a0c0e 0 25%, #0e1114 0 50%) 0 0 / 24px 24px; }
.stagearea .frame { position: absolute; }
.frame.outlined { outline: 2px dashed var(--accent); outline-offset: 0; }
@media (max-width: 760px) { .viewer.dev { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .ctl { max-height: 46vh; } }

.st small { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); }
.ctl h3 small { text-transform: none; letter-spacing: 0; font-weight: 400; }
.prov { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); } .prov b { color: var(--text); } .prov code { font-size: 11px; }
.preview { margin: 0 0 14px; padding: 10px 14px; border: 1px solid var(--warn); border-radius: 10px; color: var(--warn); font-size: 13px; }
.unavail { margin: 0; padding: 40px; color: var(--muted); text-align: center; }
.xdeps { margin: 0; color: var(--muted); font-size: 12px; }
.xstatus.review { color: #7fb8ff; } .xstatus.in-progress { color: #c9a0ff; } .xstatus.concept { color: #ff9f80; }
.xprev img { background: #050607; }
</style>

<script></script>
<script>/* LS Experience Showroom — shell. Showroom navigation lives OUTSIDE every experience; experiences run in an iframe,
 * unchanged. Routes (hash):
 *   #/showroom                      browse by brand (default)      ?by=surface · ?vertical=<id>
 *   #/showroom/<brand>              brand detail
 *   #/launch/<experience>           guest presentation (no controls; hidden escape: 5 taps bottom-left corner or Shift+Esc)
 *   #/launch/<experience>?dev=1     showroom/dev mode (states, reset, canonical viewport, fullscreen) */
(function () {
  'use strict';
  const R = window.LS_SHOWROOM_REGISTRY;
  const EMBED = window.LS_SHOWROOM_EMBED || null;            // single-file build: id → html (exact bytes of the tagged build)
  const app = document.getElementById('app');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const byId = (list, id) => list.find((x) => x.id === id);
  const surf = (id) => byId(R.surfaces, id); const vert = (id) => byId(R.verticals, id); const brand = (id) => byId(R.brands, id);
  const thumbURL = (e) => (window.LS_SHOWROOM_THUMBS && window.LS_SHOWROOM_THUMBS[e.id]) || e.thumbnail;
  function parse() {
    const raw = location.hash.replace(/^#/, '') || '/showroom';
    const [p, q] = raw.split('?'); const params = new URLSearchParams(q || '');
    return { parts: p.split('/').filter(Boolean), params };
  }
  const go = (h) => { location.hash = h; };
  window.addEventListener('hashchange', render);

  /* ---------- browse ---------- */
  function card(e) {
    const cv = e.canonicalViewport;
    return `<article class="xcard ${e.surface}" data-x="${e.id}">
      <div class="xprev ${e.surface}"><img src="${esc(thumbURL(e))}" alt="" loading="lazy"><span class="dev-label">${esc(cv.device)}</span></div>
      <div class="xbody"><p class="xsurf">${esc(surf(e.surface).title)}</p><h3>${esc(e.title)}</h3>
        <p class="xmeta">${esc(brand(e.brand).title)} · ${esc(vert(e.vertical).title)} · ${esc(e.recipe)}${e.skin ? ` / ${esc(e.skin)}` : ''}</p>
        <p class="xstatus ${esc(e.status.code)}">${esc(e.status.label)}</p>
        <p class="xbuild">${esc(e.build.tag || `${e.build.source}@${e.build.commit}`)} · ${e.build.tag ? `${esc(e.build.commit)} · ` : ''}${esc(e.build.sha256.slice(0, 12))}…</p>
        ${(e.externalDependencies || []).length ? `<p class="xdeps">External: ${e.externalDependencies.map((d) => esc(d.kind)).join(' · ')}</p>` : ''}
        ${e.provenance && e.provenance.diagnosticsBuildSha256 ? `<p class="xbuild">Showroom mode: diagnostics derivative (${esc(e.provenance.difference)}) · ${esc(e.provenance.diagnosticsBuildSha256.slice(0, 12))}…</p>` : ''}
        <div class="xacts"><a class="btn primary" href="#/launch/${e.id}">Launch</a><a class="btn" href="#/launch/${e.id}?dev=1">Showroom mode</a></div></div></article>`;
  }
  function empty(title) { return `<div class="xempty"><b>${esc(title)}</b><span>No build registered yet</span></div>`; }
  function showroom(params) {
    const by = params.get('by') === 'surface' ? 'surface' : 'brand';
    const v = params.get('vertical');
    const list = R.experiences.filter((e) => !v || e.vertical === v);
    const counts = Object.fromEntries(R.verticals.map((x) => [x.id, R.experiences.filter((e) => e.vertical === x.id).length]));
    const q = (o) => { const p = new URLSearchParams(); if (o.by && o.by !== 'brand') p.set('by', o.by); if (o.vertical) p.set('vertical', o.vertical); const s = p.toString(); return `#/showroom${s ? `?${s}` : ''}`; };
    let body;
    if (by === 'brand') {
      const brands = R.brands.filter((b) => list.some((e) => e.brand === b.id));
      body = brands.length ? brands.map((b) => `<section class="group"><header><h2><a href="#/showroom/${b.id}">${esc(b.title)}</a></h2><p>${esc(b.subtitle || '')}</p></header>
        <div class="grid">${R.surfaces.map((s) => { const xs = list.filter((e) => e.brand === b.id && e.surface === s.id); return xs.length ? xs.map(card).join('') : empty(`${s.title} — ${b.title}`); }).join('')}</div></section>`).join('')
        : '<p class="none">No experiences for this filter.</p>';
    } else {
      body = R.surfaces.map((s) => { const xs = list.filter((e) => e.surface === s.id); return `<section class="group"><header><h2>${esc(s.title)}</h2><p>${esc(s.device)}</p></header>
        <div class="grid">${xs.length ? xs.map(card).join('') : empty(s.title)}</div></section>`; }).join('');
    }
    app.innerHTML = `<div class="shell">${topbar()}
      <nav class="modes" aria-label="Browse"><a href="${q({ by: 'brand', vertical: v })}" aria-current="${by === 'brand'}">By Brand</a><a href="${q({ by: 'surface', vertical: v })}" aria-current="${by === 'surface'}">By Surface</a></nav>
      <nav class="chips" aria-label="Vertical"><a href="${q({ by })}" aria-current="${!v}">All verticals</a>${R.verticals.map((x) => `<a href="${q({ by, vertical: x.id })}" aria-current="${v === x.id}" class="${counts[x.id] ? '' : 'zero'}">${esc(x.title)} <i>${counts[x.id]}</i></a>`).join('')}</nav>
      <main>${body}</main>${foot()}</div>`;
  }
  function brandPage(id) {
    const b = brand(id); if (!b) { go('#/showroom'); return; }
    const xs = R.experiences.filter((e) => e.brand === id);
    app.innerHTML = `<div class="shell">${topbar()}<p class="crumb"><a href="#/showroom">Showroom</a> / ${esc(b.title)}</p>
      <header class="bhead"><h1>${esc(b.title)}</h1><p>${esc(b.subtitle || '')} · ${esc(vert(b.vertical).title)}</p></header>
      <main><div class="grid">${R.surfaces.map((s) => { const m = xs.filter((e) => e.surface === s.id); return m.length ? m.map(card).join('') : empty(`${s.title} — planned`); }).join('')}</div></main>${foot()}</div>`;
  }
  const topbar = () => `${EMBED ? '<p class="preview">Preview build (single file). Canonical showroom deployment: GitHub Pages — each experience served as its own unchanged file.</p>' : ''}<header class="top"><a class="logo" href="#/showroom"><b>LS</b> Experience Showroom</a><span class="count">${R.experiences.length} experiences · ${R.brands.length} brand${R.brands.length === 1 ? '' : 's'}</span></header>`;
  const foot = () => '<footer class="foot">Builds are embedded byte-for-byte from their git tags. Showroom controls never appear inside a guest experience.</footer>';

  /* ---------- launch ---------- */
  let cleanup = null;
  /* which build a launch uses: guest presentation = frozen canonical build; showroom mode = the declared diagnostics
     derivative where one exists (separate file, own sha256), otherwise the canonical build */
  const buildFor = (e, dev) => (dev && e.dev && e.dev.useDiagnosticsBuild
    ? { kind: 'diagnostics', target: e.launch.diagnosticsTarget, sha256: e.provenance.diagnosticsBuildSha256, embedKey: `${e.id}#diagnostics` }
    : { kind: 'canonical', target: e.launch.target, sha256: e.provenance.canonicalBuildSha256, embedKey: e.id });
  /* canonical (GitHub Pages): every build is its own unchanged file → src=. Preview (single file): embedded copy → blob URL. */
  function sourceOf(b) {
    if (!EMBED) return { src: b.target };
    if (EMBED[b.embedKey] === undefined) return { unavailable: true };
    return { html: EMBED[b.embedKey] };
  }
  async function launch(id, dev) {
    const e = byId(R.experiences, id); if (!e) { go('#/showroom'); return; }
    const cv = e.canonicalViewport;
    document.title = `${e.title} — ${brand(e.brand).title}`;
    app.innerHTML = dev
      ? `<div class="viewer dev"><aside class="ctl" aria-label="Showroom controls">${!e.dev ? '' : ''}
          <a class="btn" href="#/showroom/${e.brand}">← Showroom</a>
          <h2>${esc(e.title)}</h2><p class="xmeta">${esc(brand(e.brand).title)} · ${esc(surf(e.surface).title)}</p>
          <p class="xstatus ${esc(e.status.code)}">${esc(e.status.label)}</p><p class="prov" data-prov></p>
          ${e.dev ? '' : '<p class="note">No state hooks in this prototype — showroom mode offers canonical viewport, reset and fullscreen.</p>'}
          <h3>States <small>(showroom vocabulary → surface term)</small></h3><div class="states">${R.states.map((s) => { const f = e.dev && e.dev.stateMap[s]; const term = ((e.dev && e.dev.surfaceTerms) || {})[s]; return `<button type="button" class="st" data-state="${s}" ${f ? '' : 'disabled'} title="${esc(((e.dev && e.dev.stateNotes) || {})[s] || f || 'not available')}">${esc(R.stateTitles[s])}${term ? `<small>${esc(term)}</small>` : ''}</button>`; }).join('')}</div>
          <label class="all">All fixtures <select data-all><option value="">—</option>${(e.dev ? e.dev.allStates : []).map((s) => `<option>${esc(s)}</option>`).join('')}</select></label>
          <div class="row"><button type="button" class="btn" data-reset>Reset demo</button><button type="button" class="btn" data-frame aria-pressed="true">Canonical viewport</button></div>
          <button type="button" class="btn primary" data-fs>Open fullscreen</button>
          <a class="btn" href="#/launch/${e.id}">Guest presentation</a>
          <p class="cvlabel" data-cv></p><p class="note" data-note></p></aside>
        <section class="stagearea"><div class="frame ${e.launch.mode}" style="--w:${cv.width}px;--h:${cv.height}px"><iframe title="${esc(e.title)}"></iframe></div></section></div>`
      : `<div class="viewer present ${e.launch.mode}"><div class="frame ${e.launch.mode}" style="--w:${cv.width}px;--h:${cv.height}px"><iframe title="${esc(e.title)}"></iframe></div>
          <button type="button" class="escape" aria-hidden="true" tabindex="-1"></button></div>`;
    const frame = app.querySelector('.frame'); const iframe = app.querySelector('iframe');
    const b = buildFor(e, dev); const srcInfo = sourceOf(b);
    if (dev) {
      const pv = app.querySelector('[data-prov]');
      pv.innerHTML = b.kind === 'diagnostics'
        ? `<b>Diagnostics derivative</b> — not the frozen build.<br>Derived from ${esc(e.provenance.derivedFromTag)} (${esc(e.provenance.derivedFromCommit)}), difference: ${esc(e.provenance.difference)}.<br><code>${esc(b.sha256.slice(0, 16))}…</code>`
        : e.provenance && e.provenance.frozen === false
          ? `<b>Prototype build</b> (not frozen) — ${esc(e.provenance.source)}@${esc(e.provenance.commit.slice(0, 7))}<br>${esc(e.provenance.file)}<br><code>${esc(b.sha256.slice(0, 16))}…</code>${(e.externalDependencies || []).length ? `<br>External: ${e.externalDependencies.map((d) => esc(d.host)).join(', ')}` : ''}`
          : `<b>Frozen build</b> ${esc(e.build.tag)} (${esc(e.build.commit)})<br><code>${esc(b.sha256.slice(0, 16))}…</code>`;
    }
    if (srcInfo.unavailable) {
      frame.innerHTML = '<p class="unavail">Showroom mode for this experience needs its diagnostics derivative, which is only part of the canonical GitHub Pages deployment.</p>';
      frame.classList.add('fill'); return;
    }
    const html = srcInfo.html === undefined ? null : srcInfo.html;
    /* real document URL (not srcdoc): frozen experiences use hash routing + history.replaceState, which needs a proper URL */
    let blobURL = null;
    if (html !== null) { blobURL = URL.createObjectURL(new Blob([html], { type: 'text/html' })); iframe.src = blobURL; } else iframe.src = srcInfo.src;
    /* uniform scale of the canonical viewport (never a reflow); kiosk/presentation SOT fills the screen and letterboxes itself */
    const fit = () => {
      const area = dev ? app.querySelector('.stagearea').getBoundingClientRect() : { width: innerWidth, height: innerHeight };
      const intrinsic = !cv.width;
      const fill = intrinsic || (!dev && (e.launch.mode === 'kiosk' || e.launch.mode === 'responsive' || (e.launch.mode === 'phone' && innerWidth <= 520)));
      frame.classList.toggle('fill', fill);
      if (fill) { frame.style.transform = ''; const l = app.querySelector('[data-cv]'); if (l) l.textContent = intrinsic ? `${cv.device} — shown at the available size` : ''; return; }
      const s = Math.min((area.width - (dev ? 40 : 0)) / cv.width, (area.height - (dev ? 40 : 0)) / cv.height, dev ? 1 : 10);
      frame.style.transform = `scale(${s})`;
      const cvl = app.querySelector('[data-cv]'); if (cvl) cvl.textContent = `${cv.device} · shown at ${(s * 100).toFixed(0)} %`;
    };
    fit(); addEventListener('resize', fit);
    if (dev) wireDev(e, iframe, frame);

  function hook(e, iframe) {

    const note = app.querySelector('[data-note]');
    const jump = async (fx) => {
      if (!e.dev) { iframe.src = iframe.src; note.textContent = 'Reloaded'; return; }   // no hooks: reset = reload the unchanged build
      try { await hook(e, iframe).fixture(fx); note.textContent = `State: ${fx}`; app.querySelectorAll('.st').forEach((b) => b.setAttribute('aria-pressed', String(e.dev.stateMap[b.dataset.state] === fx))); }
      catch (err) { note.textContent = err.message; }
    };
    app.querySelectorAll('.st[data-state]').forEach((b) => b.addEventListener('click', () => jump(e.dev.stateMap[b.dataset.state])));
    app.querySelector('[data-all]').addEventListener('change', (ev) => { if (ev.target.value) jump(ev.target.value); });
    app.querySelector('[data-reset]').addEventListener('click', () => jump(e.dev ? e.dev.reset : null));
    app.querySelector('[data-frame]').addEventListener('click', (ev) => { const on = ev.currentTarget.getAttribute('aria-pressed') !== 'true'; ev.currentTarget.setAttribute('aria-pressed', String(on)); frame.classList.toggle('outlined', on); });
    frame.classList.add('outlined');

  }
  function requestFs() { const el = document.documentElement; if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {}); }
  /* hidden escape for showroom staff: 5 taps within 3 s on the bottom-left corner (an area left free by the frozen UIs), or Shift+Esc */
  function wireEscape(e) {
    const hot = app.querySelector('.escape'); let taps = [];
    const leave = () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); go(`#/showroom/${e.brand}`); };
    hot.addEventListener('pointerdown', () => { const t = Date.now(); taps = taps.filter((x) => t - x < 3000).concat(t); if (taps.length >= 5) { taps = []; leave(); } });
    const key = (ev) => { if (ev.key === 'Escape' && ev.shiftKey) leave(); };
    addEventListener('keydown', key);
    /* keyboard focus usually sits inside the experience: listen there too (from outside — the experience code is untouched) */
    const ifr = app.querySelector('iframe');
    const attach = () => { try { ifr.contentWindow.addEventListener('keydown', key); } catch (err) { /* cross-origin: shell key only */ } };
    ifr.addEventListener('load', attach); attach();
    const prev = cleanup; cleanup = () => { removeEventListener('keydown', key); if (prev) prev(); };
  }

  function render() {
    if (cleanup) { cleanup(); cleanup = null; }
    const { parts, params } = parse();
    document.body.className = parts[0] === 'launch' ? 'launching' : '';
    if (parts[0] === 'launch' && parts[1]) launch(parts[1], params.get('dev') === '1');
    else if (parts[0] === 'showroom' && parts[1]) { document.title = 'LS Experience Showroom'; brandPage(parts[1]); }
    else { document.title = 'LS Experience Showroom'; showroom(params); }
  }
  window.__showroom = { registry: R, render };
  render();
})();
</script>
